apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pmm.fullname" . }}
  {{- include "pmm.includeNamespace" . | nindent 2 }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.service.name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "pmm.selectorLabels" . | nindent 6 }}
  updateStrategy:
    {{- if eq .Values.upgrade.strategy "recreate" }}
    type: OnDelete
    {{- else }}
    type: RollingUpdate
    {{- if .Values.upgrade.force }}
    rollingUpdate:
      partition: 0
    {{- end }}
    {{- end }}
  {{- if .Values.upgrade.force }}
  # These fields are only set on fresh installations or forced upgrades
  minReadySeconds: 10
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  {{- end }}
  template:
    metadata:
      annotations:
        {{- include "pmm.podAnnotations" . | nindent 8 }}
      {{- include "pmm.includeNamespace" . | nindent 6 }}
      labels:
        {{- include "pmm.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or ( .Values.serviceAccount.create) (include "pmm.serviceAccountName" .) }}
      serviceAccountName: {{ include "pmm.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.encryptionKey.backupToSecret .Values.initContainers }}
      initContainers:
        {{- if .Values.encryptionKey.backupToSecret }}
        # Generates a key only when the data volume has none. Which key is actually installed is
        # decided by the next init container, which can also see the secret.
        - name: encryption-key-generate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -e

              if [ -s /srv/pmm-encryption.key ]; then
                echo "Encryption key already present on the data volume."
                exit 0
              fi

              echo "Generating a candidate encryption key..."
              /usr/sbin/pmm-encryption-rotation --generate-key > /shared/generated-key
          volumeMounts:
            - name: {{ .Values.storage.name }}
              mountPath: /srv
            - name: encryption-key-workdir
              mountPath: /shared
        # Keeps the key on the data volume and the copy in the secret in sync. An existing key is
        # never replaced: whichever of the two already exists wins, so restarts, upgrades and
        # reinstalls over retained data keep decrypting the credentials already stored.
        - name: encryption-key-reconcile
          image: "{{ .Values.encryptionKey.image.repository }}:{{ .Values.encryptionKey.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              set -e

              SECRET={{ include "pmm.encryptionKeySecretName" . }}
              NAMESPACE={{ include "pmm.namespace" . }}
              KEY_FILE=/srv/pmm-encryption.key

              # A failure to reach the API server must stop the pod. Continuing would let PMM
              # generate its own key without re-encrypting anything, leaving credentials that
              # were stored under the previous key unreadable.
              if kubectl get secret "$SECRET" --namespace="$NAMESPACE" >/dev/null 2>&1; then
                SECRET_EXISTS=yes
              else
                SECRET_EXISTS=no
              fi

              if [ -s "$KEY_FILE" ]; then
                if [ "$SECRET_EXISTS" = "no" ]; then
                  echo "Backing up the encryption key from the data volume into secret $SECRET..."
                  kubectl create secret generic "$SECRET" --namespace="$NAMESPACE" \
                    --from-file=key="$KEY_FILE"
                else
                  echo "Encryption key present on the data volume and already backed up."
                fi
                exit 0
              fi

              if [ "$SECRET_EXISTS" = "yes" ]; then
                echo "Restoring the encryption key from secret $SECRET onto the data volume..."
                kubectl get secret "$SECRET" --namespace="$NAMESPACE" \
                  -o jsonpath='{.data.key}' | base64 -d > "$KEY_FILE"
                if [ ! -s "$KEY_FILE" ]; then
                  echo "Error: secret $SECRET holds no key" >&2
                  exit 1
                fi
                chmod 644 "$KEY_FILE"
                exit 0
              fi

              echo "No encryption key found, installing the generated one..."
              cp /shared/generated-key "$KEY_FILE"
              chmod 644 "$KEY_FILE"
              kubectl create secret generic "$SECRET" --namespace="$NAMESPACE" \
                --from-file=key="$KEY_FILE"
          volumeMounts:
            - name: {{ .Values.storage.name }}
              mountPath: /srv
            - name: encryption-key-workdir
              mountPath: /shared
        {{- end }}
        {{- with .Values.initContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.pmmResources }}
          resources:
            {{- toYaml .Values.pmmResources | nindent 12 }}
          {{- end }}

          # environment passed to PMM, defined in configMap
          envFrom:
            - configMapRef:
                name: {{ include "pmm.fullname" . }}
                optional: true
            {{ if and (not .Values.secret.create) .Values.secret.name }}
            - secretRef:
                 name: {{ .Values.secret.name }}
            {{ end }}
          env:
            - name: PMM_INSTALL_METHOD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['app.kubernetes.io/managed-by']
            {{ if .Values.secret.name }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_ADMIN_PASSWORD
                  optional: true
            {{ end }}
          ports:
            - name: http
              containerPort: 8080
            - name: https
              containerPort: 8443
          startupProbe:
            httpGet:
              path: /v1/readyz
              port: http
          {{- if .Values.startupProbeConf }}
            {{- toYaml .Values.startupProbeConf | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: http
          {{- if .Values.readyProbeConf }}
            {{- toYaml .Values.readyProbeConf | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /v1/readyz
              port: http
          {{- if .Values.livenessProbeConf }}
            {{- toYaml .Values.livenessProbeConf | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ .Values.storage.name }}
              mountPath: /srv
            - name: annotations
              mountPath: "/var/run/pmm/annotations"
              readOnly: true
            {{- if .Values.certs.name }}
            - name: {{ .Values.certs.name }}
              mountPath: /srv/nginx
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
      volumes:
        - name: annotations
          projected:
            sources:
            - downwardAPI:
                items:
                  - path: "annotations"
                    fieldRef:
                      fieldPath: metadata.annotations
      {{- if .Values.encryptionKey.backupToSecret }}
        - name: encryption-key-workdir
          emptyDir: {}
      {{- end }}
      {{- if .Values.certs.name }}
        - name: {{ .Values.certs.name }}
          secret:
            secretName: {{ .Values.certs.name }}
            optional: false
      {{- end }}
      {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ .Values.storage.name }}
        {{- include "pmm.includeNamespace" . | nindent 8 }}
      spec:
        {{- if .Values.storage.selector }}
        selector:
          {{- toYaml .Values.storage.selector | nindent 10 }}
        {{- end }}
        {{ if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{ end }}
        {{- if .Values.storage.dataSource }}
        dataSource:
          {{- toYaml .Values.storage.dataSource | nindent 10 }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.storage.size }}
