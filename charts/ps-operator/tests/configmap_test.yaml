suite: ps-operator configmap
templates:
  - templates/configmap.yaml
release:
  name: unit
  namespace: test-ns
tests:
  - it: renders the controller manager config
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ConfigMap
      - equal:
          path: metadata.name
          value: unit-ps-operator-config
      - equal:
          path: metadata.namespace
          value: test-ns
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: 'kind: ControllerManagerConfig'
      - matchRegex:
          path: data["controller_manager_config.yaml"]
          pattern: 'leaderElect: true'
