suite: psmdb-operator pdb
templates:
  - templates/pdb.yaml
release:
  name: unit
  namespace: test-ns
tests:
  - it: does not render a PDB by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders a PDB when enabled
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PodDisruptionBudget
      - equal:
          path: metadata.name
          value: unit-psmdb-operator
      - equal:
          path: metadata.namespace
          value: test-ns
      - equal:
          path: spec.maxUnavailable
          value: 1
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: psmdb-operator
            app.kubernetes.io/instance: unit
