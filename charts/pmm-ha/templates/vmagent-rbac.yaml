{{- if and .Values.victoriaMetrics.enabled .Values.victoriaMetrics.vmagent.enabled .Values.victoriaMetrics.vmagent.rbac.create -}}
{{- $name := include "pmm.vmagent.name" . -}}
{{- /* Cluster-scoped names carry the namespace so same-named releases do not clash. */ -}}
{{- $clusterName := printf "%s-%s" .Release.Namespace $name -}}
{{- $rbac := .Values.victoriaMetrics.vmagent.rbac -}}
# The operator creates no RBAC for a VMAgent that names its ServiceAccount, so it is here, scoped
# to the built-in scrape jobs. rbac.extraRules and rbac.extraClusterRules widen it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
# Node discovery, kubelet and cAdvisor through the apiserver proxy, and the apiserver's /metrics.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["nodes/proxy"]
  verbs: ["get"]
- nonResourceURLs: ["/metrics"]
  verbs: ["get"]
{{- with $rbac.extraClusterRules }}
{{ toYaml . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $clusterName }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $clusterName }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
# The endpoints and pod jobs discover only the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["pods", "endpoints", "services"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
# The rendered scrape config, watched by the config-reloader.
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: ["vmagent-{{ $name }}"]
  verbs: ["get", "list", "watch"]
{{- with $rbac.extraRules }}
{{ toYaml . }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
---
# The kube-apiserver job discovers the `kubernetes` Service's endpoints, which live in `default`.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $clusterName }}-apiserver
  namespace: default
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["endpoints", "services", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $clusterName }}-apiserver
  namespace: default
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $clusterName }}-apiserver
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
{{- if eq (include "pmm.nodeExporter.mode" .) "openshift" }}
---
# The platform node-exporter; its kube-rbac-proxy checks the /metrics grant in the ClusterRole.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $clusterName }}-node-exporter
  namespace: openshift-monitoring
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
rules:
- apiGroups: [""]
  resources: ["endpoints", "services", "pods"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["discovery.k8s.io"]
  resources: ["endpointslices"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $clusterName }}-node-exporter
  namespace: openshift-monitoring
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $clusterName }}-node-exporter
subjects:
- kind: ServiceAccount
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
