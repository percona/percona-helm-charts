{{- if .Values.centralBackupStorage.enabled }}
---
# Backup / restore orchestrator script, shipped by the chart (files/pmm-backup.sh) and
# mounted into the backup-tools Deployment, the backup CronJob's Job pods, and the
# restore Job (examples/restore-job.yaml) — no pod ever needs a manual `kubectl cp`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-backup-scripts
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.componentLabels" (list . "backup-tools") | nindent 4 }}
data:
  # The one orchestrator: backup / restore / list subcommands (PMM-13858 merged the two
  # former orchestrators and the sourced backup-layout.sh into this file — the duplicated
  # halves had drifted apart repeatedly).
  pmm-backup.sh: |
{{ required "files/pmm-backup.sh is missing from the chart — every backup/restore entry point execs it, and .Files.Get would silently render an empty key" (.Files.Get "files/pmm-backup.sh") | indent 4 }}
  # Tool bootstrap. It is the Job pods' `command:`, which is what lets a clone-and-swap
  # rewrite only `args` (the operation) without discarding the bootstrap — see the script's
  # own header. The Deployment calls it with --ensure-tools-only at start-up.
  backup-entrypoint.sh: |
{{ required "files/backup-entrypoint.sh is missing from the chart — it is the command of every backup/restore Job pod, and .Files.Get would silently render an empty key" (.Files.Get "files/backup-entrypoint.sh") | indent 4 }}
{{- end }}
