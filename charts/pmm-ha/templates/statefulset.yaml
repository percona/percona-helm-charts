{{- include "pmm.nodeExporter.validate" . -}}
{{- include "pmm.validateSecret" . -}}
{{- include "pmm.vm.validateCredential" . -}}
{{- include "pmm.replicas.validate" . -}}
{{- include "pmm.keeper.validate" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pmm.fullname" . }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.service.name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "pmm.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        {{- include "pmm.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "pmm.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "pmm.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      # Init container to verify secret exists before starting main app
      initContainers:
        - name: wait-for-pg-secret
          image: alpine/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for secret to be available..."
              until kubectl get secret pg-encryption-key -n {{ .Release.Namespace }}; do
                echo "Secret not found, retrying in 5s..."
                sleep 5
              done
              echo "Secret found, proceeding..."
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
        - name: wait-for-clickhouse
          image: {{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              # Check if password is available
              if [ -z "${PMM_CLICKHOUSE_PASSWORD}" ]; then
                echo "✗ ERROR: PMM_CLICKHOUSE_PASSWORD environment variable is not set"
                exit 1
              fi
              
              EXPECTED_REPLICAS={{ .Values.clickhouse.cluster.replicas }}
              SERVICE_HOST="clickhouse-{{ .Release.Name }}"
              
              echo "=== Waiting for ClickHouse Cluster ==="
              echo "Cluster name: ${PMM_CLICKHOUSE_CLUSTER_NAME}"
              echo "Expected replicas: ${EXPECTED_REPLICAS}"
              echo "Service host: ${SERVICE_HOST}"
              echo "======================================"
              
              echo "Waiting for ClickHouse connectivity..."
              while :; do
                if clickhouse-client --host "${SERVICE_HOST}" \
                  --user "${PMM_CLICKHOUSE_USER}" --password "${PMM_CLICKHOUSE_PASSWORD}" \
                  --query "SELECT version()" >/dev/null 2>&1; then
                  echo "✓ Connected to ClickHouse successfully"
                  break
                fi

                echo "Waiting for ClickHouse to become available..."
                sleep 5
              done
              
              echo "Waiting for cluster to form..."
              while :; do
                REPLICA_COUNT=$(clickhouse-client --host "${SERVICE_HOST}" \
                  --user "${PMM_CLICKHOUSE_USER}" --password "${PMM_CLICKHOUSE_PASSWORD}" \
                  --query "SELECT count() FROM system.clusters WHERE cluster='${PMM_CLICKHOUSE_CLUSTER_NAME}'" 2>/dev/null || echo 0)
                
                if [ "$REPLICA_COUNT" -eq "$EXPECTED_REPLICAS" ]; then
                  echo "✓ ClickHouse cluster is ready with ${REPLICA_COUNT}/${EXPECTED_REPLICAS} replicas"
                  break
                fi
                
                echo "Cluster status: ${REPLICA_COUNT}/${EXPECTED_REPLICAS} replicas visible"
                sleep 5
              done              
          env:
            - name: PMM_CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_CLICKHOUSE_USER
            - name: PMM_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_CLICKHOUSE_PASSWORD
            - name: PMM_CLICKHOUSE_CLUSTER_NAME
              value: "{{ .Values.clickhouse.cluster.name }}"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        # Nothing above waits for PostgreSQL itself: the pg-encryption-key secret comes from a
        # pre-install hook, and the image's own wait covers only its built-in PostgreSQL. On a
        # fresh install where PostgreSQL takes longer than the startup probe budget, the PMM
        # container would be restarted into CrashLoopBackOff. The PMM Server image ships
        # pg_isready (outside PATH, next to psql), so this pulls no extra image.
        - name: wait-for-pg
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/bash
            - -c
            - |
              pg_isready="$(dirname "$(readlink -f "$(command -v psql)")")/pg_isready"
              test -x "$pg_isready" || { echo "pg_isready not found at $pg_isready"; exit 1; }
              echo "Waiting for PostgreSQL at ${PMM_POSTGRES_ADDR}..."
              until "$pg_isready" -q -t 5 -h "${PMM_POSTGRES_ADDR%:*}" -p "${PMM_POSTGRES_ADDR##*:}"; do
                echo "PostgreSQL is not accepting connections yet, retrying in 5s..."
                sleep 5
              done
              echo "PostgreSQL is accepting connections"
          env:
            - name: PMM_POSTGRES_ADDR
              value: {{ include "pmm.postgres.addr" . | quote }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: {{ .Chart.Name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.pmmResources }}
          resources:
            {{- toYaml .Values.pmmResources | nindent 12 }}
          {{- end }}

          # environment passed to PMM, defined in configMap
          envFrom:
            - configMapRef:
                name: {{ include "pmm.fullname" . }}
                optional: true
            {{ if and (not .Values.secret.create) .Values.secret.name }}
            - secretRef:
                 name: {{ .Values.secret.name }}
            {{ end }}
          env:
            - name: PMM_INSTALL_METHOD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['app.kubernetes.io/managed-by']
            - name: PMM_HA_ADVERTISE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PMM_HA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PMM_HA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{/*
            Grafana reads the admin password from GF_SECURITY_ADMIN_PASSWORD, but the secret
            stores it under PMM_ADMIN_PASSWORD. With a user-created secret (secret.create: false,
            the documented default) the envFrom secretRef above injects that secret's keys
            verbatim and cannot rename one, so the mapping has to be emitted here; with
            secret.create there is no envFrom secretRef at all and this is the only source.
            Either way it must not be gated on secret.create - that gate is what caused
            PMM-15400, leaving PMM on its built-in admin password. charts/pmm guards the same
            env on secret.name.

            Where envFrom does apply, env wins over it, so a GF_SECURITY_ADMIN_PASSWORD key also
            placed in the secret is overridden - PMM_ADMIN_PASSWORD is the single source of truth.

            Required, not optional: pmm.validateSecret refuses to render without the key, so an
            optional ref would only serve to let a key deleted after install silently drop the
            env var again. Note charts/pmm still uses optional: true for its copy of this ref.
            */}}
            {{ if .Values.secret.name }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_ADMIN_PASSWORD
                  optional: false
            {{ end }}
            {{ if .Values.secret.create }}
            # additional secrets that could be used for Grafana iDP
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  optional: true
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  optional: true
            {{ end }}
            - name: PMM_POSTGRES_USERNAME
              value: {{ index .Values "pg-db" "pmmUserName" | quote }}
            - name: PMM_POSTGRES_DBPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PG_PASSWORD
            - name: GF_DATABASE_TYPE
              value: "postgres"
            - name: GF_DATABASE_HOST
              value: {{ include "pmm.postgres.addr" . | quote }}
            - name: GF_DATABASE_NAME
              value: "grafana"
            - name: GF_DATABASE_USER
              value: {{ index .Values "pg-db" "grafanaUserName" | quote }}
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: GF_PASSWORD
            # VictoriaMetrics (vmauth) credentials. Named PMM_HA_* on purpose: PMM Server reads them only
            # through PMM_VM_URL below, and the PMM_HA_ prefix keeps them out of the VMAGENT_* passthrough
            # that PMM forwards to every PMM Client's vmagent.
            - name: PMM_HA_VM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_HA_VM_USERNAME
            - name: PMM_HA_VM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_HA_VM_PASSWORD
            - name: PMM_CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_CLICKHOUSE_USER
            - name: PMM_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_CLICKHOUSE_PASSWORD
            # Read-only credentials for the Grafana ClickHouse data source, kept apart from the
            # privileged pair above because Grafana queries run on behalf of every signed-in user.
            - name: PMM_CLICKHOUSE_DATASOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pmm.clickhouse.datasourceSecretName" . }}
                  key: PMM_CLICKHOUSE_DATASOURCE_USER
            - name: PMM_CLICKHOUSE_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pmm.clickhouse.datasourceSecretName" . }}
                  key: PMM_CLICKHOUSE_DATASOURCE_PASSWORD
            - name: PMM_VM_URL
              value: "http://$(PMM_HA_VM_USERNAME):$(PMM_HA_VM_PASSWORD)@{{ include "pmm.fullname" . }}-vmauth.{{ .Release.Namespace }}.svc.cluster.local:8427/"
            - name: PMM_CLICKHOUSE_ADDR
              value: "{{ include "pmm.fullname" . }}-clickhouse-sticky.{{ .Release.Namespace }}.svc.cluster.local:9000"
            - name: PMM_CLICKHOUSE_CLUSTER_NAME
              value: "{{ .Values.clickhouse.cluster.name }}"
            - name: PMM_POSTGRES_ADDR
              value: {{ include "pmm.postgres.addr" . | quote }}
            - name: PMM_HA_PEERS
              value: "{{ include "pmm.haPeers" . }}"
            {{- if index .Values "pg-db" "pmm" "enabled" }}
            # Let PMM know of dedicated nodes that must not be used for monitoring other services.
            - name: PMM_INTERNAL_NODE_NAME_PREFIXES
              value: "{{ .Release.Namespace }}-{{ include "pg-database.fullname" . }}-"
            {{- end }}
            - name: PMM_CLICKHOUSE_NODES
              value: {{ include "pmm.clickhouse.nodes" . | quote }}
            - name: PMM_ENCRYPTION_KEY_PATH
              value: /etc/secrets/key
            {{- /* Only emitted when dataRetentionDays is set. PMM refuses to change data
                   retention from the UI or API while PMM_DATA_RETENTION is present, so the
                   chart stays out of the way unless retention is managed declaratively.
                   PMM takes a Go duration and requires a whole number of days. */}}
            {{- if .Values.dataRetentionDays }}
            - name: PMM_DATA_RETENTION
              value: "{{ mul (int .Values.dataRetentionDays) 24 }}h"
            {{- end }}
          ports:
            - name: https
              containerPort: 8443
          # Both probes check Grafana through nginx, the path the UI's Grafana requests take,
          # rather than /v1/readyz: readyz also checks QAN, whose health check pings the shared
          # ClickHouse, so a ClickHouse outage would restart every replica at once. HAProxy
          # routes all traffic to the Raft leader, so a leader whose Grafana is gone breaks the
          # UI for everyone; restarting it moves leadership off it, because pmm-managed hands
          # leadership to a peer on shutdown. Setting startupProbeConf or livenessProbeConf to
          # null drops that probe.
          {{- with .Values.startupProbeConf }}
          startupProbe:
            httpGet:
              path: /graph/api/health
              port: https
              scheme: HTTPS
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Grafana's health check is SELECT 1 on its PostgreSQL database, so a plain httpGet here
          # would restart every replica at once during a shared database fault. When the Grafana
          # check fails, liveness repeats that SELECT 1 from outside Grafana with Grafana's own
          # credentials: if it works the fault is this replica's (Grafana dead, hung, or holding
          # a broken connection pool) and the replica is restarted; if it fails the database is
          # the problem and a restart would not help. pg_isready is not enough here: it reports
          # "accepting connections" while the grafana database itself refuses them. nginx serves
          # the same server block on 8080 without TLS. The psql call is bounded by coreutils
          # timeout rather than a statement_timeout startup option, which pgbouncer rejects.
          # What the script prints ends up in the kubelet's "Liveness probe failed" event.
          {{- with .Values.livenessProbeConf }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  curl -sf --max-time 3 -o /dev/null http://127.0.0.1:8080/graph/api/health && exit 0
                  command -v psql >/dev/null || { echo "Grafana health check failed and psql is missing, so the fault cannot be attributed: restarting"; exit 1; }
                  if PGCONNECT_TIMEOUT=3 PGPASSWORD="$GF_DATABASE_PASSWORD" timeout 5 \
                       psql -w -h "${GF_DATABASE_HOST%:*}" -p "${GF_DATABASE_HOST##*:}" -U "$GF_DATABASE_USER" -d "$GF_DATABASE_NAME" -Atqc 'SELECT 1' >/dev/null 2>&1; then
                    echo "Grafana health check failed while its database answers SELECT 1: replica fault, restarting"
                    exit 1
                  fi
                  echo "Grafana health check failed and its database does not answer SELECT 1: database fault, not restarting"
                  exit 0
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: https
              scheme: HTTPS
          {{- if .Values.readyProbeConf }}
            {{- toYaml .Values.readyProbeConf | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ .Values.storage.name }}
              mountPath: /srv
            - name: annotations
              mountPath: "/var/run/pmm/annotations"
              readOnly: true
            - name: encryption-key
              mountPath: /etc/secrets
              readOnly: true
            {{- if .Values.certs.name }}
            - name: {{ .Values.certs.name }}
              mountPath: /srv/nginx
              readOnly: true
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
        {{- if .Values.logStreamer.enabled }}
        {{- range $index, $logFile := .Values.logStreamer.logFiles }}
        # Sidecar container to stream {{ $logFile }} to stdout
        - name: log-streamer-{{ $index }}
          image: busybox:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for log file {{ $logFile }} to be created..."
              while [ ! -f {{ $logFile }} ]; do
                sleep 2
              done
              echo "Log file found, starting tail from beginning..."
              tail -F -n +1 {{ $logFile }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: {{ $.Values.storage.name }}
              mountPath: /srv
              readOnly: true
        {{- end }}
        {{- end }}
      volumes:
        - name: annotations
          projected:
            sources:
            - downwardAPI:
                items:
                  - path: "annotations"
                    fieldRef:
                      fieldPath: metadata.annotations
        - name: encryption-key
          secret:
            secretName: pg-encryption-key
      {{- if .Values.certs.name }}
        - name: {{ .Values.certs.name }}
          secret:
            secretName: {{ .Values.certs.name }}
            optional: false
      {{- end }}
      {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ .Values.storage.name }}
      spec:
        {{- if .Values.storage.selector }}
        selector:
          {{- toYaml .Values.storage.selector | nindent 10 }}
        {{- end }}
        {{ if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{ end }}
        {{- if .Values.storage.dataSource }}
        dataSource:
          {{- toYaml .Values.storage.dataSource | nindent 10 }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.storage.size }}
