{{- include "pmm.helmVersion.validate" . -}}
{{- include "pmm.nodeExporter.validate" . -}}
{{- include "pmm.dataRetention.validate" . -}}
{{- include "pmm.openshift.validate" . -}}
{{- include "pmm.podSecurity.validate" . -}}
{{- include "pmm.haproxy.validate" . -}}
{{- include "pmm.validateSecret" . -}}
{{- include "pmm.vm.validateCredential" . -}}
{{- include "pmm.validateBackupIrsaSa" . -}}
{{- include "pmm.replicas.validate" . -}}
{{- include "pmm.keeper.validate" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "pmm.fullname" . }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Values.service.name }}
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "pmm.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      annotations:
        {{- include "pmm.podAnnotations" . | nindent 8 }}
      labels:
        {{- include "pmm.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.image.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "pmm.serviceAccountName" . }}
      {{- end }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- include "pmm.podSecurityContext" . | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-clickhouse
          image: {{ .Values.clickhouse.image.repository }}:{{ .Values.clickhouse.image.tag }}
          imagePullPolicy: {{ .Values.clickhouse.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
              set -e
              
              # Check if password is available
              if [ -z "${PMM_CLICKHOUSE_PASSWORD}" ]; then
                echo "✗ ERROR: PMM_CLICKHOUSE_PASSWORD environment variable is not set"
                exit 1
              fi
              
              EXPECTED_REPLICAS={{ .Values.clickhouse.cluster.replicas }}
              SERVICE_HOST="clickhouse-{{ .Release.Name }}"
              
              echo "=== Waiting for ClickHouse Cluster ==="
              echo "Cluster name: ${PMM_CLICKHOUSE_CLUSTER_NAME}"
              echo "Expected replicas: ${EXPECTED_REPLICAS}"
              echo "Service host: ${SERVICE_HOST}"
              echo "======================================"
              
              echo "Waiting for ClickHouse connectivity..."
              while :; do
                if clickhouse-client --host "${SERVICE_HOST}" \
                  --user "${PMM_CLICKHOUSE_USER}" --password "${PMM_CLICKHOUSE_PASSWORD}" \
                  --query "SELECT version()" >/dev/null 2>&1; then
                  echo "✓ Connected to ClickHouse successfully"
                  break
                fi

                echo "Waiting for ClickHouse to become available..."
                sleep 5
              done
              
              echo "Waiting for cluster to form..."
              while :; do
                REPLICA_COUNT=$(clickhouse-client --host "${SERVICE_HOST}" \
                  --user "${PMM_CLICKHOUSE_USER}" --password "${PMM_CLICKHOUSE_PASSWORD}" \
                  --query "SELECT count() FROM system.clusters WHERE cluster='${PMM_CLICKHOUSE_CLUSTER_NAME}'" 2>/dev/null || echo 0)
                
                if [ "$REPLICA_COUNT" -eq "$EXPECTED_REPLICAS" ]; then
                  echo "✓ ClickHouse cluster is ready with ${REPLICA_COUNT}/${EXPECTED_REPLICAS} replicas"
                  break
                fi
                
                echo "Cluster status: ${REPLICA_COUNT}/${EXPECTED_REPLICAS} replicas visible"
                sleep 5
              done              
          env:
            - name: PMM_CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_CLICKHOUSE_USER
            - name: PMM_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_CLICKHOUSE_PASSWORD
            - name: PMM_CLICKHOUSE_CLUSTER_NAME
              value: "{{ .Values.clickhouse.cluster.name }}"
            # clickhouse-client writes its history under $HOME, which is / (not writable) for uid 1000.
            - name: HOME
              value: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
        # Hold the PMM container until PostgreSQL accepts connections, so a slow database does
        # not eat into the startup probe budget. pg_isready is in the PMM Server image, off PATH.
        # -U is required under an arbitrary UID with no passwd entry (OpenShift): without it
        # pg_isready makes no attempt (exit 3). It only pings, so the user need not exist.
        - name: wait-for-pg
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
              pg_isready="$(dirname "$(readlink -f "$(command -v psql)")")/pg_isready"
              test -x "$pg_isready" || { echo "pg_isready not found at $pg_isready"; exit 1; }
              echo "Waiting for PostgreSQL at ${PMM_POSTGRES_ADDR}..."
              until "$pg_isready" -q -t 5 -U pmm -h "${PMM_POSTGRES_ADDR%:*}" -p "${PMM_POSTGRES_ADDR##*:}"; do
                [ $? -ne 3 ] || { echo "pg_isready made no connection attempt (invalid connection parameters)"; exit 1; }
                echo "PostgreSQL is not accepting connections yet, retrying in 5s..."
                sleep 5
              done
              echo "PostgreSQL is accepting connections"
          env:
            - name: PMM_POSTGRES_ADDR
              value: {{ include "pmm.postgres.addr" . | quote }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
      containers:
        - name: {{ .Chart.Name }}

          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.pmmResources }}
          resources:
            {{- toYaml .Values.pmmResources | nindent 12 }}
          {{- end }}

          # environment passed to PMM, defined in configMap
          envFrom:
            - configMapRef:
                name: {{ include "pmm.fullname" . }}
                optional: true
            {{ if and (not .Values.secret.create) .Values.secret.name }}
            - secretRef:
                 name: {{ .Values.secret.name }}
            {{ end }}
          env:
            - name: PMM_INSTALL_METHOD
              valueFrom:
                fieldRef:
                  fieldPath: metadata.annotations['app.kubernetes.io/managed-by']
            - name: PMM_HA_ADVERTISE_ADDRESS
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: PMM_HA_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: PMM_HA_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{/*
            Grafana reads the admin password from GF_SECURITY_ADMIN_PASSWORD, but the secret
            stores it under PMM_ADMIN_PASSWORD. With a user-created secret (secret.create: false,
            the documented default) the envFrom secretRef above injects that secret's keys
            verbatim and cannot rename one, so the mapping has to be emitted here; with
            secret.create there is no envFrom secretRef at all and this is the only source.
            Either way it must not be gated on secret.create - that gate is what caused
            PMM-15400, leaving PMM on its built-in admin password. charts/pmm guards the same
            env on secret.name.

            Where envFrom does apply, env wins over it, so a GF_SECURITY_ADMIN_PASSWORD key also
            placed in the secret is overridden - PMM_ADMIN_PASSWORD is the single source of truth.

            Required, not optional: pmm.validateSecret refuses to render without the key, so an
            optional ref would only serve to let a key deleted after install silently drop the
            env var again. Note charts/pmm still uses optional: true for its copy of this ref.
            */}}
            {{ if .Values.secret.name }}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_ADMIN_PASSWORD
                  optional: false
            {{ end }}
            {{ if .Values.secret.create }}
            # additional secrets that could be used for Grafana iDP
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: GF_AUTH_GENERIC_OAUTH_CLIENT_ID
                  optional: true
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  optional: true
            {{ end }}
            - name: PMM_POSTGRES_USERNAME
              value: {{ index .Values "pg-db" "pmmUserName" | quote }}
            - name: PMM_POSTGRES_DBPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PG_PASSWORD
            - name: GF_DATABASE_TYPE
              value: "postgres"
            - name: GF_DATABASE_HOST
              value: {{ include "pmm.postgres.addr" . | quote }}
            - name: GF_DATABASE_NAME
              value: "grafana"
            - name: GF_DATABASE_USER
              value: {{ index .Values "pg-db" "grafanaUserName" | quote }}
            - name: GF_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: GF_PASSWORD
            # VictoriaMetrics (vmauth) credentials. Named PMM_HA_* on purpose: PMM Server reads them only
            # through PMM_VM_URL below, and the PMM_HA_ prefix keeps them out of the VMAGENT_* passthrough
            # that PMM forwards to every PMM Client's vmagent.
            - name: PMM_HA_VM_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_HA_VM_USERNAME
            - name: PMM_HA_VM_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_HA_VM_PASSWORD
            - name: PMM_CLICKHOUSE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_CLICKHOUSE_USER
            - name: PMM_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: PMM_CLICKHOUSE_PASSWORD
            # Read-only credentials for the Grafana ClickHouse data source, kept apart from the
            # privileged pair above because Grafana queries run on behalf of every signed-in user.
            - name: PMM_CLICKHOUSE_DATASOURCE_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "pmm.clickhouse.datasourceSecretName" . }}
                  key: PMM_CLICKHOUSE_DATASOURCE_USER
            - name: PMM_CLICKHOUSE_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "pmm.clickhouse.datasourceSecretName" . }}
                  key: PMM_CLICKHOUSE_DATASOURCE_PASSWORD
            - name: PMM_VM_URL
              value: "http://$(PMM_HA_VM_USERNAME):$(PMM_HA_VM_PASSWORD)@{{ include "pmm.fullname" . }}-vmauth.{{ .Release.Namespace }}.svc.cluster.local:8427/"
            - name: PMM_CLICKHOUSE_ADDR
              value: "{{ include "pmm.fullname" . }}-clickhouse-sticky.{{ .Release.Namespace }}.svc.cluster.local:9000"
            - name: PMM_CLICKHOUSE_CLUSTER_NAME
              value: "{{ .Values.clickhouse.cluster.name }}"
            - name: PMM_POSTGRES_ADDR
              value: {{ include "pmm.postgres.addr" . | quote }}
            - name: PMM_HA_PEERS
              value: "{{ include "pmm.haPeers" . }}"
            {{- if index .Values "pg-db" "pmm" "enabled" }}
            # Let PMM know of dedicated nodes that must not be used for monitoring other services.
            - name: PMM_INTERNAL_NODE_NAME_PREFIXES
              value: "{{ .Release.Namespace }}-{{ include "pg-database.fullname" . }}-"
            {{- end }}
            - name: PMM_CLICKHOUSE_NODES
              value: {{ include "pmm.clickhouse.nodes" . | quote }}
            - name: PMM_ENCRYPTION_KEY_PATH
              value: /etc/secrets/key
            # Derived from dataRetentionDays, and rendered on every replica unconditionally:
            # PMM fixes retention when it starts, so a replica without this variable falls
            # back to whatever period is already stored and warns that the chart should be
            # supplying one. Declared here rather than in pmmEnv so it always wins over the
            # ConfigMap.
            - name: PMM_DATA_RETENTION
              value: {{ include "pmm.dataRetention.pmm" . | quote }}
          ports:
            - name: https
              containerPort: 8443
          # Both probes check Grafana through nginx rather than /v1/readyz, which also checks the
          # shared ClickHouse. Restarting a replica moves Raft leadership off it. null drops a probe.
          {{- with .Values.startupProbeConf }}
          startupProbe:
            httpGet:
              path: /graph/api/health
              port: https
              scheme: HTTPS
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Grafana's health check depends on the shared PostgreSQL, so a failed check counts only
          # while Grafana's database still answers SELECT 1; otherwise a restart would not help and
          # would hit every replica at once. Bounded with coreutils timeout, not statement_timeout
          # (pgbouncer rejects it). psql takes Grafana's TLS settings, so a certificate fault is not
          # mistaken for a replica fault; disable is Grafana's own default. The script's output
          # ends up in the kubelet event.
          {{- with .Values.livenessProbeConf }}
          livenessProbe:
            exec:
              command:
                - /bin/bash
                - -c
                - |
                  curl -sf --max-time 3 -o /dev/null http://127.0.0.1:8080/graph/api/health && exit 0
                  command -v psql >/dev/null || { echo "Grafana health check failed and psql is missing, so the fault cannot be attributed: restarting"; exit 1; }
                  export PGSSLMODE="${GF_DATABASE_SSL_MODE:-disable}"
                  [ -z "$GF_DATABASE_CA_CERT_PATH" ] || export PGSSLROOTCERT="$GF_DATABASE_CA_CERT_PATH"
                  [ -z "$GF_DATABASE_CLIENT_CERT_PATH" ] || export PGSSLCERT="$GF_DATABASE_CLIENT_CERT_PATH"
                  [ -z "$GF_DATABASE_CLIENT_KEY_PATH" ] || export PGSSLKEY="$GF_DATABASE_CLIENT_KEY_PATH"
                  if PGCONNECT_TIMEOUT=3 PGPASSWORD="$GF_DATABASE_PASSWORD" timeout 5 \
                       psql -w -h "${GF_DATABASE_HOST%:*}" -p "${GF_DATABASE_HOST##*:}" -U "$GF_DATABASE_USER" -d "$GF_DATABASE_NAME" -Atqc 'SELECT 1' >/dev/null 2>&1; then
                    echo "Grafana health check failed while its database answers SELECT 1: replica fault, restarting"
                    exit 1
                  fi
                  echo "Grafana health check failed and its database does not answer SELECT 1: database fault, not restarting"
                  exit 0
            {{- toYaml . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /v1/readyz
              port: https
              scheme: HTTPS
          {{- if .Values.readyProbeConf }}
            {{- toYaml .Values.readyProbeConf | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: {{ .Values.storage.name }}
              mountPath: /srv
            - name: annotations
              mountPath: "/var/run/pmm/annotations"
              readOnly: true
            - name: encryption-key
              mountPath: /etc/secrets
              readOnly: true
            {{- if .Values.certs.name }}
            - name: {{ .Values.certs.name }}
              mountPath: /srv/nginx
              readOnly: true
            {{- end }}
            {{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "shared") }}
            # shared mode: orchestrator runs an in-pod `tar -czf <sharedMountPath>/backup_<id>/pmm-server/<pod>/srv.tar.gz`
            - name: central-backup-storage
              mountPath: {{ .Values.centralBackupStorage.sharedMountPath }}
            {{- end }}
            {{- if .Values.extraVolumeMounts }}
            {{- toYaml .Values.extraVolumeMounts | nindent 12 }}
            {{- end }}
        {{- if .Values.logStreamer.enabled }}
        {{- range $index, $logFile := .Values.logStreamer.logFiles }}
        # Sidecar container to stream {{ $logFile }} to stdout
        - name: log-streamer-{{ $index }}
          image: "{{ $.Values.logStreamer.image.repository }}:{{ $.Values.logStreamer.image.tag }}"
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Waiting for log file {{ $logFile }} to be created..."
              while [ ! -f {{ $logFile }} ]; do
                sleep 2
              done
              echo "Log file found, starting tail from beginning..."
              tail -F -n +1 {{ $logFile }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          volumeMounts:
            - name: {{ $.Values.storage.name }}
              mountPath: /srv
              readOnly: true
        {{- end }}
        {{- end }}
        {{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "s3") }}
        # Backup sidecar: archives /srv and streams it to S3 via rclone.
        # Passive agent (sleeps); the backup orchestrator execs into it to run the upload.
        - name: pmm-backup
          image: "{{ .Values.centralBackupStorage.client.image.registry }}/{{ .Values.centralBackupStorage.client.image.repository }}:{{ .Values.centralBackupStorage.client.image.tag }}"
          command: ["sleep", "infinity"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            {{- include "pmm.rcloneS3Env" . | nindent 12 }}
            {{- with .Values.centralBackupStorage.s3.existingSecret }}
            {{- include "pmm.s3KeyEnv" (dict "secret" . "keys" $.Values.centralBackupStorage.s3.existingSecretKeys) | nindent 12 }}
            {{- end }}
            {{- with .Values.centralBackupStorage.s3.irsaRoleArn }}
            # IRSA for this container only: the PMM SA is shared with the pmm container and vmagent.
            - name: AWS_ROLE_ARN
              value: {{ index ($.Values.centralBackupStorage.s3.serviceAccountAnnotations | default dict) "eks.amazonaws.com/role-arn" | default . | quote }}
            - name: AWS_WEB_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/pmm-backup/token
            - name: AWS_REGION
              value: {{ $.Values.centralBackupStorage.s3.region | quote }}
            {{- end }}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: {{ .Values.storage.name }}
              mountPath: /srv
              readOnly: true
            {{- if .Values.centralBackupStorage.s3.irsaRoleArn }}
            - name: pmm-backup-aws-token
              mountPath: /var/run/secrets/pmm-backup
              readOnly: true
            {{- end }}
        {{- end }}
      volumes:
        - name: annotations
          projected:
            sources:
            - downwardAPI:
                items:
                  - path: "annotations"
                    fieldRef:
                      fieldPath: metadata.annotations
        # Required: the pod waits in ContainerCreating until pmm-secret-init-job creates it.
        - name: encryption-key
          secret:
            secretName: pg-encryption-key
      {{- if .Values.certs.name }}
        - name: {{ .Values.certs.name }}
          secret:
            secretName: {{ .Values.certs.name }}
            optional: false
      {{- end }}
      {{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "shared") }}
        {{- include "pmm.centralBackupVolume" . | nindent 8 }}
      {{- end }}
      {{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "s3") .Values.centralBackupStorage.s3.irsaRoleArn }}
        {{- $saAnn := .Values.centralBackupStorage.s3.serviceAccountAnnotations | default dict }}
        # The pmm-backup sidecar's web-identity token (the EKS webhook's settings, by hand).
        - name: pmm-backup-aws-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: {{ index $saAnn "eks.amazonaws.com/audience" | default "sts.amazonaws.com" | quote }}
                  expirationSeconds: {{ index $saAnn "eks.amazonaws.com/token-expiration" | default 86400 }}
                  path: token
      {{- end }}
      {{- if .Values.extraVolumes }}
        {{- toYaml .Values.extraVolumes | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: {{ .Values.storage.name }}
      spec:
        {{- if .Values.storage.selector }}
        selector:
          {{- toYaml .Values.storage.selector | nindent 10 }}
        {{- end }}
        {{ if .Values.storage.storageClassName }}
        storageClassName: {{ .Values.storage.storageClassName }}
        {{ end }}
        {{- if .Values.storage.dataSource }}
        dataSource:
          {{- toYaml .Values.storage.dataSource | nindent 10 }}
        {{- end }}
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.storage.size }}
