{{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "s3") .Values.centralBackupStorage.s3.irsaRoleArn }}
---
# S3 identity for VM/ClickHouse pods. Bound to no Role: every such pod mounts its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pmm.backupS3SaName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.componentLabels" (dict "ctx" . "component" "backup-s3") | nindent 4 }}
  annotations:
    {{- include "pmm.backupIrsaAnnotations" . | nindent 4 }}
{{- with .Values.centralBackupStorage.tools.imagePullSecrets }}
{{- /* On the IRSA path the s3-mode temp restore pods run under this SA. */}}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
