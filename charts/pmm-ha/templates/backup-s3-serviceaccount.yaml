{{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "s3") .Values.centralBackupStorage.s3.irsaRoleArn }}
---
# Dedicated IRSA ServiceAccount for operator-managed pods (VMCluster vmstorage, ClickHouse)
# so their backup tools (vmbackup, clickhouse-backup) get S3 credentials via the AWS
# credential chain (web-identity token). Referenced by vmcluster.yaml and
# clickhouse-cluster.yaml — previously the chart referenced it without creating it, which
# left those pods pointing at a non-existent SA. S3 access only: no Role is bound to it, since
# every VM and ClickHouse pod mounts its token (the backup runs as <release>-backup-sa).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pmm.backupS3SaName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.componentLabels" (list . "backup-s3") | nindent 4 }}
  annotations:
    {{- include "pmm.backupIrsaAnnotations" . | nindent 4 }}
{{- with .Values.centralBackupStorage.tools.imagePullSecrets }}
{{- /* The same block as backup-tools.yaml's SA, and it has to be here too: on the IRSA path
       the s3-mode temp restore pods (tools image) run under THIS SA (S3_SERVICE_ACCOUNT). */}}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
