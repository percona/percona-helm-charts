{{- if and .Values.victoriaMetrics.enabled .Values.victoriaMetrics.vmauth.enabled -}}
{{- /* Validate the pre-created secret here as well as in statefulset.yaml. Helm renders
       same-depth templates in reverse alphabetical order, so this file runs first, and a
       user-owned secret that lacks one of the keys has to be named here rather than quietly
       resolving to something else further down.

       This is not a complete guard. pmm.validateSecret is a no-op when secret.create is set,
       and there a pmm-secret that predates the PMM_HA_VM_* keys resolves to a freshly
       generated credential instead of failing. */ -}}
{{- include "pmm.validateSecret" . -}}
{{- /* Resolved centrally so vmauth's config and pmm-secret cannot end up with different credentials */ -}}
{{- $vmuser := include "pmm.vm.username" . }}
{{- $insertURL := printf "http://vminsert-%s-vmcluster.%s.svc.cluster.local:8480/insert/0/prometheus/" (include "pmm.fullname" .) .Release.Namespace }}
{{- $selectURL := printf "http://vmselect-%s-vmcluster.%s.svc.cluster.local:8481/select/0/prometheus/" (include "pmm.fullname" .) .Release.Namespace }}
{{- /* Every read path Grafana's Prometheus data source reaches for. A path that is not
       listed here does not 404 quietly - vmauth answers 400 with a plain-text
       "missing route for ...", which Grafana then fails to parse as a Prometheus
       response. query_exemplars and status/buildinfo were missing, so each panel with
       exemplars enabled logged a parse failure on every refresh (PMM-15461). vmselect
       serves both: exemplars return an empty placeholder, buildinfo the Prometheus
       version Grafana uses to pick its API dialect.

       Once buildinfo answered, Grafana's Alert rules page started asking this data
       source for its rules too, and failed with "Errors loading rules" (PMM-15556).
       vmselect answers rules and alerts with empty placeholders, as single-node
       VictoriaMetrics does, because PMM sets no -vmalert.proxyURL. */}}
{{- $readPaths := list "/api/v1/query" "/api/v1/query_range" "/api/v1/series" "/api/v1/labels" "/api/v1/label/.+/values" "/api/v1/query_exemplars" "/api/v1/status/buildinfo" "/api/v1/rules" "/api/v1/alerts" }}
{{- if .Values.gitops.enabled }}
---
# The user vmauth validates requests against. A VMUser rather than a config secret, because the
# operator resolves passwordRef from the PMM secret at runtime, so the password never has to be
# known when the chart is rendered. The username is not a secret and comes from values; it must
# equal PMM_HA_VM_USERNAME in the PMM secret, which PMM Server and vmagent authenticate with.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMUser
metadata:
  name: {{ include "pmm.fullname" . }}-vmauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.componentLabels" (dict "ctx" . "component" "vmauth") | nindent 4 }}
spec:
  username: {{ $vmuser | quote }}
  passwordRef:
    name: {{ .Values.secret.name }}
    key: PMM_HA_VM_PASSWORD
  # Otherwise the operator copies the credential into a vmuser-<name> secret of its own.
  disable_secret_creation: true
  targetRefs:
    - static:
        url: {{ $insertURL | quote }}
      paths:
        - "/api/v1/write"
    - static:
        url: {{ $selectURL | quote }}
      paths:
        {{- range $readPaths }}
        - {{ . | quote }}
        {{- end }}
{{- else }}
{{- $vmpass := include "pmm.vm.password" . }}
---
# Secret for VMAuth configuration
# Note: VMAuth requires plaintext credentials in its config file to validate incoming requests
# This is the standard VMAuth configuration pattern
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pmm.fullname" . }}-vmauth-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.componentLabels" (dict "ctx" . "component" "vmauth") | nindent 4 }}
type: Opaque
stringData:
  config.yaml: |
    users:
    - username: {{ $vmuser | quote }}
      password: {{ $vmpass | quote }}
      url_map:
      - src_paths:
        - "/api/v1/write"
        url_prefix: {{ $insertURL | quote }}
      - src_paths:
        {{- range $readPaths }}
        - {{ . | quote }}
        {{- end }}
        url_prefix: {{ $selectURL | quote }}
{{- end }}
---
# VMAuth CRD managed by VictoriaMetrics operator
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: {{ include "pmm.fullname" . }}-vmauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.componentLabels" (dict "ctx" . "component" "vmauth") | nindent 4 }}
spec:
  useStrictSecurity: {{ .Values.victoriaMetrics.useStrictSecurity }}
  {{- if .Values.victoriaMetrics.version }}
  # Pinned alongside the VMCluster - see victoriaMetrics.version in values.yaml.
  componentVersion: {{ .Values.victoriaMetrics.version | quote }}
  {{- end }}

  # Number of VMAuth replicas
  replicaCount: {{ .Values.victoriaMetrics.vmauth.replicaCount }}
  
  {{ if .Values.gitops.enabled -}}
  # Config generated by the operator from this release's VMUser only, not every VMUser in the namespace.
  selectAllByDefault: false
  userSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: vmauth
  {{- else -}}
  # Reference to the config secret
  configSecret: {{ include "pmm.fullname" . }}-vmauth-config
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.resources }}
  # Resource limits and requests
  resources:
    {{- toYaml .Values.victoriaMetrics.vmauth.resources | nindent 4 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.affinity }}
  # Pod affinity configuration
  affinity:
    {{- toYaml .Values.victoriaMetrics.vmauth.affinity | nindent 4 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.tolerations }}
  # Pod tolerations
  tolerations:
    {{- toYaml .Values.victoriaMetrics.vmauth.tolerations | nindent 4 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.nodeSelector }}
  # Node selector
  nodeSelector:
    {{- toYaml .Values.victoriaMetrics.vmauth.nodeSelector | nindent 4 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.podAnnotations }}
  # Pod annotations
  podMetadata:
    annotations:
      {{- toYaml .Values.victoriaMetrics.vmauth.podAnnotations | nindent 6 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.extraArgs }}
  # Extra arguments for vmauth
  extraArgs:
    {{- toYaml .Values.victoriaMetrics.vmauth.extraArgs | nindent 4 }}
  {{- end }}
  
  # Service specification
  serviceSpec:
    metadata:
      name: {{ include "pmm.fullname" . }}-vmauth
      labels:
        app: vmauth
        {{- include "pmm.labels" . | nindent 8 }}
    spec:
      type: ClusterIP
      ports:
        - name: http
          port: 8427
          targetPort: http
          protocol: TCP
  
  # Port configuration
  port: "8427"
{{- end }}

