{{- if and .Values.victoriaMetrics.enabled .Values.victoriaMetrics.vmauth.enabled -}}
{{- /* Validate the pre-created secret here as well as in statefulset.yaml. Helm renders
       same-depth templates in reverse alphabetical order, so this file runs before
       statefulset.yaml, and it is what reports a pre-created secret that is missing
       VMAGENT_remoteWrite_basicAuth_username or _password: the helper below falls back to a
       generated value rather than failing, so without this call a missing key would silently
       give vmauth a password nothing else has. Keep it ahead of the two includes.

       This is not a complete guard for the rest of the secret. pmm.validateSecret is a no-op
       when secret.create is set, and clickhouse-cluster.yaml still decodes a key unguarded.
       PMM-15436 fixes that at the read site. */ -}}
{{- include "pmm.validateSecret" . -}}
{{- /* Both keys go through pmm.secret.key so that this file and secret.yaml agree on them.
       vmagent.yaml and statefulset.yaml read the pair out of pmm-secret with a secretKeyRef,
       while the vmauth config below needs the same pair in plaintext to accept those requests.
       Deriving them here the way this file used to - a lookup that comes back empty on a fresh
       secret.create install, then randAlphaNum - handed vmauth a password vmagent never got, so
       remote write failed authentication on every install that let the chart create the secret.
       The helper returns base64, hence the b64dec. */ -}}
{{- $vmuser := include "pmm.secret.key" (dict "ctx" $ "key" "VMAGENT_remoteWrite_basicAuth_username" "override" (.Values.secret.victoriametrics_user | default "victoriametrics_pmm")) | b64dec }}
{{- $vmpass := include "pmm.secret.key" (dict "ctx" $ "key" "VMAGENT_remoteWrite_basicAuth_password" "override" .Values.secret.victoriametrics_password) | b64dec }}
---
# Secret for VMAuth configuration
# Note: VMAuth requires plaintext credentials in its config file to validate incoming requests
# This is the standard VMAuth configuration pattern
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pmm.fullname" . }}-vmauth-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
    app.kubernetes.io/component: vmauth
type: Opaque
stringData:
  config.yaml: |
    users:
    - username: {{ $vmuser | quote }}
      password: {{ $vmpass | quote }}
      url_map:
      - src_paths:
        - "/api/v1/write"
        url_prefix: "http://vminsert-{{ include "pmm.fullname" . }}-vmcluster.{{ .Release.Namespace }}.svc.cluster.local:8480/insert/0/prometheus/"
      {{- /* Every read path Grafana's Prometheus data source reaches for. A path that is not
             listed here does not 404 quietly - vmauth answers 400 with a plain-text
             "missing route for ...", which Grafana then fails to parse as a Prometheus
             response. query_exemplars and status/buildinfo were missing, so each panel with
             exemplars enabled logged a parse failure on every refresh (PMM-15461). vmselect
             serves both: exemplars return an empty placeholder, buildinfo the Prometheus
             version Grafana uses to pick its API dialect. */}}
      - src_paths:
        - "/api/v1/query"
        - "/api/v1/query_range"
        - "/api/v1/series"
        - "/api/v1/labels"
        - "/api/v1/label/.+/values"
        - "/api/v1/query_exemplars"
        - "/api/v1/status/buildinfo"
        url_prefix: "http://vmselect-{{ include "pmm.fullname" . }}-vmcluster.{{ .Release.Namespace }}.svc.cluster.local:8481/select/0/prometheus/"
---
# VMAuth CRD managed by VictoriaMetrics operator
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAuth
metadata:
  name: {{ include "pmm.fullname" . }}-vmauth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
    app.kubernetes.io/component: vmauth
spec:
  {{- if .Values.victoriaMetrics.version }}
  # Pinned alongside the VMCluster - see victoriaMetrics.version in values.yaml.
  componentVersion: {{ .Values.victoriaMetrics.version | quote }}
  {{- end }}

  # Number of VMAuth replicas
  replicaCount: {{ .Values.victoriaMetrics.vmauth.replicaCount }}
  
  # Reference to the config secret
  configSecret: {{ include "pmm.fullname" . }}-vmauth-config
  
  {{- if .Values.victoriaMetrics.vmauth.resources }}
  # Resource limits and requests
  resources:
    {{- toYaml .Values.victoriaMetrics.vmauth.resources | nindent 4 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.affinity }}
  # Pod affinity configuration
  affinity:
    {{- toYaml .Values.victoriaMetrics.vmauth.affinity | nindent 4 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.tolerations }}
  # Pod tolerations
  tolerations:
    {{- toYaml .Values.victoriaMetrics.vmauth.tolerations | nindent 4 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.nodeSelector }}
  # Node selector
  nodeSelector:
    {{- toYaml .Values.victoriaMetrics.vmauth.nodeSelector | nindent 4 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.podAnnotations }}
  # Pod annotations
  podMetadata:
    annotations:
      {{- toYaml .Values.victoriaMetrics.vmauth.podAnnotations | nindent 6 }}
  {{- end }}
  
  {{- if .Values.victoriaMetrics.vmauth.extraArgs }}
  # Extra arguments for vmauth
  extraArgs:
    {{- toYaml .Values.victoriaMetrics.vmauth.extraArgs | nindent 4 }}
  {{- end }}
  
  # Service specification
  serviceSpec:
    metadata:
      name: {{ include "pmm.fullname" . }}-vmauth
      labels:
        app: vmauth
        {{- include "pmm.labels" . | nindent 8 }}
    spec:
      type: ClusterIP
      ports:
        - name: http
          port: 8427
          targetPort: http
          protocol: TCP
  
  # Port configuration
  port: "8427"
{{- end }}

