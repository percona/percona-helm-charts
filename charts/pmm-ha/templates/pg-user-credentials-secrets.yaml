{{- $gfPassword := "" }}
{{- $pgPassword := "" }}
{{- $render := true }}
{{- if .Values.secret.create }}
{{/*
Under secret.create the PMM secret is created by secret.yaml's pre-install hook, which has not run
yet: Helm renders every template before it applies any hook. Looking the secret up here and failing
when it is absent is what made secret.create unusable for a fresh install. Derive the two passwords
through the same helper secret.yaml uses instead, so both templates write the same value.
*/}}
{{- $gfPassword = include "pmm.secret.key" (dict "ctx" $ "key" "GF_PASSWORD" "override" .Values.secret.gf_password) }}
{{- $pgPassword = include "pmm.secret.key" (dict "ctx" $ "key" "PG_PASSWORD" "override" .Values.secret.pg_password) }}
{{- else }}
{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.secret.name) }}
{{- if and (not $existingSecret) .Values.secret.requireExisting }}
{{- fail (printf "Secret '%s' not found in namespace '%s'. Please ensure the secret exists before installing this chart (or set secret.requireExisting=false for an offline render)." .Values.secret.name .Release.Namespace) }}
{{- end }}
{{/*
Without a cluster to ask (secret.requireExisting=false) there are no passwords to copy, so leave
both Secrets out of the render rather than emitting them empty.
*/}}
{{- $render = not (empty $existingSecret) }}
{{- if $render }}
{{- $existingData := $existingSecret.data }}
{{/*
No per-key check here: pmm.validateSecret owns that. It is included from statefulset.yaml and
vmauth.yaml, both of which Helm renders before this file, and it reports every missing key of the
pre-created secret in one message instead of one key at a time. Re-adding a check here would only
produce a second message that can never be reached.
*/}}
{{- $gfPassword = get $existingData "GF_PASSWORD" }}
{{- $pgPassword = get $existingData "PG_PASSWORD" }}
{{- end }}
{{- end }}
{{- if $render }}
{{- /* The hook is pre-install only, so an upgrade never re-syncs these: fail on drift rather than break PMM's next restart. */}}
{{- range $user, $pw := dict (index .Values "pg-db" "grafanaUserName") (list $gfPassword "GF_PASSWORD") (index .Values "pg-db" "pmmUserName") (list $pgPassword "PG_PASSWORD") }}
{{- $live := lookup "v1" "Secret" $.Release.Namespace (printf "%s-credentials" $user) }}
{{- if and $live (index $live "data") (ne (get $live.data "password") (index $pw 0)) }}
{{- fail (printf "Secret %s-credentials no longer matches %s in secret %s, so PostgreSQL user %s would reject PMM after its next restart. Re-sync it (the operator re-applies the password in seconds), then upgrade again:\n  kubectl -n %s patch secret %s-credentials -p \"{\\\"data\\\":{\\\"password\\\":\\\"$(kubectl -n %s get secret %s -o jsonpath='{.data.%s}')\\\",\\\"verifier\\\":null}}\"" $user (index $pw 1) $.Values.secret.name $user $.Release.Namespace $user $.Release.Namespace $.Values.secret.name (index $pw 1)) }}
{{- end }}
{{- end }}
---
# Grafana PostgreSQL user credentials
apiVersion: v1
kind: Secret
metadata:
  name: {{ index .Values "pg-db" "grafanaUserName" }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    # pre-install only: the PG operator adopts these, so a pre-upgrade create fails every upgrade.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  password: {{ $gfPassword | quote }}
---
# PMM PostgreSQL user credentials
apiVersion: v1
kind: Secret
metadata:
  name: {{ index .Values "pg-db" "pmmUserName" }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    # pre-install only: the PG operator adopts these, so a pre-upgrade create fails every upgrade.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  password: {{ $pgPassword | quote }}
{{- end }}

