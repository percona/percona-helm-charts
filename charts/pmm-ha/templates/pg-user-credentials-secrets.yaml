{{- $existingSecret := (lookup "v1" "Secret" .Release.Namespace .Values.secret.name) }}
{{- if not $existingSecret }}
{{- fail (printf "Secret '%s' not found in namespace '%s'. Please ensure the secret exists before installing this chart." .Values.secret.name .Release.Namespace) }}
{{- end }}
{{- $existingData := $existingSecret.data }}
{{- $gfPassword := get $existingData "GF_PASSWORD" }}
{{- $pgPassword := get $existingData "PG_PASSWORD" }}
{{- if not $gfPassword }}
{{- fail (printf "Secret '%s' is missing required key 'GF_PASSWORD'. Please add this key to the secret." .Values.secret.name) }}
{{- end }}
{{- if not $pgPassword }}
{{- fail (printf "Secret '%s' is missing required key 'PG_PASSWORD'. Please add this key to the secret." .Values.secret.name) }}
{{- end }}
---
# Grafana PostgreSQL user credentials
apiVersion: v1
kind: Secret
metadata:
  name: {{ index .Values "pg-db" "grafanaUserName" }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    # pre-install ONLY, deliberately. These two secrets exist to SEED the PostgreSQL operator;
    # once it has them it adopts them (managed-by becomes percona-postgresql-operator and the
    # Helm annotations are stripped) and owns them from then on. Helm CREATES hook resources
    # rather than patching them, so a pre-upgrade hook hits "secrets ... already exists" and
    # EVERY `helm upgrade` of this chart fails, whatever it was meant to change.
    #
    # hook-delete-policy: before-hook-creation does NOT fix it: the operator recreates the
    # secret ~2s after the delete (measured), so Helm's create still loses the race. Not
    # re-running the hook is the only thing that works, and it costs nothing - the operator is
    # the owner after install, so a re-run could not have updated the password anyway.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  password: {{ $gfPassword | quote }}
---
# PMM PostgreSQL user credentials
apiVersion: v1
kind: Secret
metadata:
  name: {{ index .Values "pg-db" "pmmUserName" }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace }}
    # pre-install ONLY, deliberately. These two secrets exist to SEED the PostgreSQL operator;
    # once it has them it adopts them (managed-by becomes percona-postgresql-operator and the
    # Helm annotations are stripped) and owns them from then on. Helm CREATES hook resources
    # rather than patching them, so a pre-upgrade hook hits "secrets ... already exists" and
    # EVERY `helm upgrade` of this chart fails, whatever it was meant to change.
    #
    # hook-delete-policy: before-hook-creation does NOT fix it: the operator recreates the
    # secret ~2s after the delete (measured), so Helm's create still loses the race. Not
    # re-running the hook is the only thing that works, and it costs nothing - the operator is
    # the owner after install, so a re-run could not have updated the password anyway.
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-10"
type: Opaque
data:
  password: {{ $pgPassword | quote }}

