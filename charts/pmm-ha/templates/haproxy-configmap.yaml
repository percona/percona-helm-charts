apiVersion: v1
kind: ConfigMap
metadata:
  name: pmm-ha-haproxy
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: haproxy
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  haproxy.cfg: |
    global
        log stdout    local0 debug
        log stdout    local1 info
        log stdout    local2 info
        daemon
    
    resolvers k8s
        # Read the cluster DNS server from the pod's own /etc/resolv.conf rather than naming
        # a service. The vanilla-Kubernetes name kube-dns.kube-system does not exist on
        # OpenShift (it is dns-default.openshift-dns), and HAProxy rejects an unresolvable
        # nameserver at config-parse time, so hardcoding either name breaks the other platform.
        parse-resolv-conf
        resolve_retries 5
        timeout resolve 2s
        timeout retry   1s
        hold valid      10s
        hold nx         30s
        hold other      30s
        hold obsolete   30s
        accepted_payload_size 8192
    
    defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        timeout connect 5000
        timeout client  50000
        timeout server  50000
    
    {{- if .Values.haproxy.monitoring.stats.enabled | default true }}
    # Statistics and monitoring
    frontend stats
        bind *:{{ .Values.haproxy.monitoring.stats.port | default 1024 }}
        stats enable
        stats uri {{ .Values.haproxy.monitoring.stats.uri | default "/stats" }}
        stats refresh {{ .Values.haproxy.monitoring.stats.refresh | default "30s" }}
        stats admin if TRUE
        {{- if .Values.haproxy.monitoring.prometheus.enabled | default true }}
        http-request use-service prometheus-exporter if { path {{ .Values.haproxy.monitoring.prometheus.path | default "/metrics" }} }
        {{- end }}
    {{- end }}
    
    frontend https_front
        # Bind port follows haproxy.containerPorts.https so it can be moved above 1024.
        # OpenShift's restricted-v2 runs the container as a non-root uid with all
        # capabilities dropped and allowPrivilegeEscalation=false, so NET_BIND_SERVICE is
        # unavailable and binding 443 fails with EACCES. The Service port follows the same
        # value, so expose 443 externally through an Ingress or an OpenShift Route.
        bind *:{{ (.Values.haproxy.containerPorts).https | default 443 }} ssl crt /etc/haproxy/certs/pmm.pem
        default_backend https_back

    backend https_back
        option httpchk
        http-check send meth GET uri /v1/server/leaderHealthCheck ver HTTP/1.1 hdr Host www
        http-check expect status 200
        # Use server-template for dynamic DNS-based discovery of PMM pods
        # This automatically discovers pods when scaling up/down without requiring HAProxy restart
        # HAProxy will re-resolve DNS based on 'hold valid' setting in the resolver (10s)
        server-template pmm 1-{{ $.Values.maxReplicas | default 10 }} {{ $.Values.service.name | default "monitoring-service" }}.{{ $.Release.Namespace }}.svc.cluster.local:8443 check ssl verify none resolvers k8s init-addr last,libc,none
    