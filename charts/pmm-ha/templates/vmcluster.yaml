{{- if .Values.victoriaMetrics.enabled -}}
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMCluster
metadata:
  name: {{ include "pmm.fullname" . }}-vmcluster
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pmm.labels" . | nindent 4 }}
    app.kubernetes.io/component: victoria-metrics-cluster
spec:
  # Retention period for metrics
  retentionPeriod: {{ .Values.victoriaMetrics.vmstorage.retentionPeriod | quote }}
  
  # Replication factor for vmstorage (how many copies of data to store)
  # Should be <= vmstorage.replicaCount for redundancy
  replicationFactor: {{ .Values.victoriaMetrics.replicationFactor }}

  {{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "s3") .Values.centralBackupStorage.s3.irsaRoleArn }}
  # Run components under the IRSA-annotated SA so vmbackup gets S3 creds via the AWS
  # credential chain (web-identity token), no static keys needed.
  serviceAccountName: {{ .Values.centralBackupStorage.s3.serviceAccountName | default "pmm-ha-backup-s3" }}
  {{- end }}

  # VMSelect component configuration (handles read queries)
  vmselect:
    replicaCount: {{ .Values.victoriaMetrics.vmselect.replicaCount }}
    {{- if .Values.victoriaMetrics.vmselect.resources }}
    resources:
      {{- toYaml .Values.victoriaMetrics.vmselect.resources | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmselect.affinity }}
    affinity:
      {{- toYaml .Values.victoriaMetrics.vmselect.affinity | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmselect.tolerations }}
    tolerations:
      {{- toYaml .Values.victoriaMetrics.vmselect.tolerations | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmselect.nodeSelector }}
    nodeSelector:
      {{- toYaml .Values.victoriaMetrics.vmselect.nodeSelector | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmselect.podAnnotations }}
    podMetadata:
      annotations:
        {{- toYaml .Values.victoriaMetrics.vmselect.podAnnotations | nindent 8 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmselect.extraArgs }}
    extraArgs:
      {{- toYaml .Values.victoriaMetrics.vmselect.extraArgs | nindent 6 }}
    {{- end }}
    # Service configuration for vmselect
    serviceSpec:
      metadata:
        labels:
          app: vmselect
          {{- include "pmm.labels" . | nindent 10 }}
      spec:
        type: ClusterIP
        ports:
          - name: http
            port: 8481
            targetPort: http

  # VMInsert component configuration (handles write requests)
  vminsert:
    replicaCount: {{ .Values.victoriaMetrics.vminsert.replicaCount }}
    {{- if .Values.victoriaMetrics.vminsert.resources }}
    resources:
      {{- toYaml .Values.victoriaMetrics.vminsert.resources | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vminsert.affinity }}
    affinity:
      {{- toYaml .Values.victoriaMetrics.vminsert.affinity | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vminsert.tolerations }}
    tolerations:
      {{- toYaml .Values.victoriaMetrics.vminsert.tolerations | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vminsert.nodeSelector }}
    nodeSelector:
      {{- toYaml .Values.victoriaMetrics.vminsert.nodeSelector | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vminsert.podAnnotations }}
    podMetadata:
      annotations:
        {{- toYaml .Values.victoriaMetrics.vminsert.podAnnotations | nindent 8 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vminsert.extraArgs }}
    extraArgs:
      {{- toYaml .Values.victoriaMetrics.vminsert.extraArgs | nindent 6 }}
    {{- end }}
    # Service configuration for vminsert
    serviceSpec:
      metadata:
        labels:
          app: vminsert
          {{- include "pmm.labels" . | nindent 10 }}
      spec:
        type: ClusterIP
        ports:
          - name: http
            port: 8480
            targetPort: http

  # VMStorage component configuration (stores metrics data)
  vmstorage:
    replicaCount: {{ .Values.victoriaMetrics.vmstorage.replicaCount }}
    {{- if .Values.victoriaMetrics.vmstorage.resources }}
    resources:
      {{- toYaml .Values.victoriaMetrics.vmstorage.resources | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmstorage.affinity }}
    affinity:
      {{- toYaml .Values.victoriaMetrics.vmstorage.affinity | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmstorage.tolerations }}
    tolerations:
      {{- toYaml .Values.victoriaMetrics.vmstorage.tolerations | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmstorage.nodeSelector }}
    nodeSelector:
      {{- toYaml .Values.victoriaMetrics.vmstorage.nodeSelector | nindent 6 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmstorage.podAnnotations }}
    podMetadata:
      annotations:
        {{- toYaml .Values.victoriaMetrics.vmstorage.podAnnotations | nindent 8 }}
    {{- end }}
    {{- if .Values.victoriaMetrics.vmstorage.extraArgs }}
    extraArgs:
      {{- toYaml .Values.victoriaMetrics.vmstorage.extraArgs | nindent 6 }}
    {{- end }}
    {{- /* Gated on the centralBackupStorage master switch: without the backup infrastructure
           the vmbackup/vmrestore sidecars are idle sleep-infinity containers (100m CPU
           request each per vmstorage pod) plus a dead emptyDir. */}}
    {{- if and .Values.centralBackupStorage.enabled .Values.victoriaMetrics.vmstorage.backup.enabled }}
    # vmbackup sidecar for backups
    # vmbackup is a one-shot tool, so we keep the container alive and trigger backups manually
    containers:
      - name: vmbackup
        image: {{ .Values.victoriaMetrics.vmstorage.backup.image }}
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        env:
          {{- if .Values.victoriaMetrics.vmstorage.backup.s3.enabled }}
          - name: AWS_REGION
            value: {{ .Values.victoriaMetrics.vmstorage.backup.s3.region | default .Values.centralBackupStorage.s3.region }}
          {{- /* Endpoint falls back to the central S3 endpoint (like the credentials below),
                 so "set centralBackupStorage.s3 once" also points vmbackup at MinIO/Ceph
                 instead of AWS. */}}
          {{- $vmEndpoint := .Values.victoriaMetrics.vmstorage.backup.s3.endpoint | default .Values.centralBackupStorage.s3.endpoint }}
          {{- if $vmEndpoint }}
          - name: AWS_ENDPOINT
            value: {{ $vmEndpoint }}
          {{- end }}
          {{- /* Credentials default to the central S3 secret so a MinIO/Ceph user who sets
                 centralBackupStorage.s3.existingSecret once also authenticates vmbackup,
                 instead of silently failing VM uploads every run. */}}
          {{- $vmS3 := .Values.victoriaMetrics.vmstorage.backup.s3 }}
          {{- $vmSecret := $vmS3.existingSecret }}
          {{- $vmKeys := $vmS3.existingSecretKeys }}
          {{- if not $vmSecret }}{{- $vmSecret = .Values.centralBackupStorage.s3.existingSecret }}{{- $vmKeys = .Values.centralBackupStorage.s3.existingSecretKeys }}{{- end }}
          {{- if $vmSecret }}
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: {{ $vmSecret }}
                key: {{ include "pmm.s3SecretKeyName" (dict "keys" $vmKeys "which" "access") }}
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: {{ $vmSecret }}
                key: {{ include "pmm.s3SecretKeyName" (dict "keys" $vmKeys "which" "secret") }}
          {{- end }}
          {{- end }}
        volumeMounts:
          - name: vmstorage-db
            mountPath: /vmstorage-data
            readOnly: true
          - name: vmstorage-backup
            mountPath: /vmstorage-backup
          {{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "shared") }}
          # shared mode: vmbackup -dst=fs://<sharedMountPath>/backup_<id>/victoriametrics/<pod>/...
          - name: central-backup-storage
            mountPath: {{ .Values.centralBackupStorage.sharedMountPath }}
          {{- end }}
        resources:
          {{- toYaml .Values.victoriaMetrics.vmstorage.backup.resources | nindent 10 }}
    {{- if .Values.victoriaMetrics.vmstorage.backup.restoreImage }}
      - name: vmrestore
        image: {{ .Values.victoriaMetrics.vmstorage.backup.restoreImage }}
        imagePullPolicy: IfNotPresent
        command: ["sleep", "infinity"]
        volumeMounts:
          - name: vmstorage-db
            mountPath: /vmstorage-data
          - name: vmstorage-backup
            mountPath: /vmstorage-backup
          {{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "shared") }}
          # shared mode: vmrestore -src=fs://<sharedMountPath>/backup_<id>/victoriametrics/<pod>/...
          - name: central-backup-storage
            mountPath: {{ .Values.centralBackupStorage.sharedMountPath }}
          {{- end }}
        resources:
          {{- toYaml .Values.victoriaMetrics.vmstorage.backup.resources | nindent 10 }}
    {{- end }}
    {{- end }}
    # Persistent storage configuration
    storage:
      volumeClaimTemplate:
        spec:
          {{- if .Values.victoriaMetrics.vmstorage.storageClassName }}
          storageClassName: {{ .Values.victoriaMetrics.vmstorage.storageClassName }}
          {{- end }}
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: {{ .Values.victoriaMetrics.vmstorage.storageSize }}
    {{- /* Gated on the centralBackupStorage master switch: without the backup infrastructure
           the vmbackup/vmrestore sidecars are idle sleep-infinity containers (100m CPU
           request each per vmstorage pod) plus a dead emptyDir. */}}
    {{- if and .Values.centralBackupStorage.enabled .Values.victoriaMetrics.vmstorage.backup.enabled }}
    # Additional volumes for backup storage
    # Using emptyDir because VictoriaMetrics operator doesn't support multiple PVCs per pod
    # For persistent backups, use S3 configuration below
    volumes:
      - name: vmstorage-backup
        emptyDir:
          sizeLimit: {{ .Values.victoriaMetrics.vmstorage.backupVolumeSize }}
      {{- if and .Values.centralBackupStorage.enabled (eq .Values.centralBackupStorage.mode "shared") }}
      {{- include "pmm.centralBackupVolume" . | nindent 6 }}
      {{- end }}
    {{- end }}
    # Service configuration for vmstorage
    serviceSpec:
      metadata:
        labels:
          app: vmstorage
          {{- include "pmm.labels" . | nindent 10 }}
      spec:
        type: ClusterIP
        ports:
          - name: http
            port: 8482
            targetPort: http
          - name: vminsert
            port: 8400
            targetPort: vminsert
          - name: vmselect
            port: 8401
            targetPort: vmselect
{{- end }}

