## OpenShift overlay for the pmm-ha chart.
##
##   helm install pmm-ha percona/pmm-ha -n <namespace> -f examples/values-openshift.yaml
##
## OpenShift's `restricted-v2` SCC gives every namespace its own uid range and supplemental-group
## range and rejects any pod requesting values outside them. Each setting below clears one such
## rejection; without them the StatefulSets and Deployments are admitted-then-refused and Helm
## still reports STATUS: deployed while no pods exist.

## PMM Server and PMM Client: emit no pod securityContext, so OpenShift assigns uid and fsGroup.
openshift: true

## The bundled kube-state-metrics pins uid/gid/fsGroup 65534, which is outside the namespace range.
kube-state-metrics:
  securityContext:
    enabled: false

## The bundled node-exporter needs hostNetwork, hostPID, hostPath volumes and host port 9100 -
## none of which restricted-v2 permits. OpenShift's platform monitoring already runs a
## node-exporter, so scrape that one instead.
prometheus-node-exporter:
  enabled: false
nodeExporter:
  mode: openshift

## HAProxy terminates TLS on 443. restricted-v2 runs the container as a non-root uid with all
## capabilities dropped and allowPrivilegeEscalation=false, so it cannot bind a port below 1024
## (`cannot bind socket (Permission denied) for [0.0.0.0:443]`). Move the container port above
## 1024. The HAProxy Service publishes this same port, so expose 443 externally with an OpenShift
## Route pointing at the pmm-ha-haproxy Service. Do not use the chart's own `ingress.enabled` for
## this - it targets monitoring-service and bypasses HAProxy, losing leader routing.
haproxy:
  containerPorts:
    https: 8443
  ## The chart runs HAProxy as uid 1000; let the SCC assign one instead.
  podSecurityContext:
    runAsUser: null

## The PGO PMM sidecar in every PostgreSQL pod reaches PMM through HAProxy too, and the operator
## copies this value verbatim into PMM_AGENT_SERVER_ADDRESS. pmm-agent appends :443 to an address
## that carries no port, so with the bare hostname the sidecar would dial a port HAProxy no longer
## publishes - silently, while the install still looks healthy. Spell the port out.
pg-db:
  pmm:
    serverHost: pmm-ha-haproxy:8443
    ## For when pg-db passes it through: let the SCC assign the uid.
    containerSecurityContext:
      runAsUser: null

## `openshift: true` covers PMM Server and PMM Client only; restricted-v2 also rejects the uids
## pinned for ClickHouse, Keeper and the helper Jobs, so let the SCC assign those.
clickhouse:
  podSecurityContext:
    runAsUser: null
    runAsGroup: null
    fsGroup: null
  keeper:
    podSecurityContext:
      runAsUser: null
      runAsGroup: null
      fsGroup: null

jobs:
  podSecurityContext:
    runAsUser: null

## The backup tools pin 65534 as well (with centralBackupStorage.enabled).
centralBackupStorage:
  tools:
    podSecurityContext:
      runAsUser: null
      fsGroup: null

## Strict security pins uid 65534, which restricted-v2 refuses; the SCC supplies an equivalent.
victoriaMetrics:
  useStrictSecurity: false
