# Example: PostgreSQL Backup - Local Storage Only
# Simple configuration with local backups only (fastest recovery)

pg-db:
  backups:
    enabled: true
    trackLatestRestorableTime: true
    
    pgbackrest:
      # Retention lives under `global`, NOT `manual.options`. global reaches EVERY backup the
      # operator takes - replica-create, scheduled and manual - while manual.options reaches
      # on-demand backups only, so retention placed there leaves the SCHEDULES below on the
      # chart default of one full. pgBackRest then warns that the repository may run out of
      # space and keeps every full it ever takes. These merge over the defaults in
      # values.yaml (pg-db.backups.pgbackrest.global), which already set
      # repo1-retention-full-type: count.
      global:
        repo1-retention-full: "7"        # Keep 7 full backups
        repo1-retention-diff: "3"        # Keep 3 differential backups
        repo1-retention-archive: "7"     # Keep 7 sets of WAL archives

      manual:
        repoName: repo1
        options:
        - --type=incr
      
      repos:
      - name: repo1
        schedules:
          full: "0 2 * * 0"           # Sunday 2 AM - Weekly full backup
          differential: "0 2 * * 3"   # Wednesday 2 AM - Mid-week differential
          incremental: "0 */6 * * *"  # Every 6 hours - Frequent incremental
        volume:
          volumeClaimSpec:
            storageClassName: "gp3"   # Use fast SSD storage
            accessModes:
            - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi        # Adjust based on your DB size

# Usage:
# helm upgrade --install pmm-ha charts/pmm-ha \
#   -n demo \
#   -f charts/pmm-ha/examples/pg-backup-local-only.yaml
