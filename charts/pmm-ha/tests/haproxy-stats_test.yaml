# The HAProxy stats page and Prometheus exporter have no authentication, so the
# pmm-ha-haproxy Service, which users expose as LoadBalancer or NodePort, must not publish them.
# vmagent reaches them through the headless pmm-ha-haproxy-stats Service instead.
suite: pmm-ha HAProxy stats exposure
templates:
  - charts/haproxy/templates/service.yaml
  - charts/haproxy/templates/deployment.yaml
  # The subchart Deployment includes it for a checksum annotation
  - charts/haproxy/templates/configmap.yaml
  - templates/haproxy-stats-service.yaml
  - templates/vmagent.yaml
release:
  name: smoke
  namespace: pmm
tests:
  - it: publishes only the HTTPS port on pmm-ha-haproxy
    template: charts/haproxy/templates/service.yaml
    set: {haproxy.service.type: LoadBalancer}
    asserts:
      - equal:
          path: spec.ports
          value:
            - {name: https, protocol: TCP, port: 443, targetPort: https}

  - it: serves the stats port on a headless Service
    template: templates/haproxy-stats-service.yaml
    asserts:
      - equal:
          path: metadata.name
          value: pmm-ha-haproxy-stats
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: haproxy-stats
      - equal:
          path: spec.clusterIP
          value: None
      - notExists:
          path: spec.type
      - equal:
          path: spec.ports
          value:
            - {name: stat, protocol: TCP, port: 1024, targetPort: 1024}

  - it: follows an explicit stats port
    template: templates/haproxy-stats-service.yaml
    set: {haproxy.monitoring.stats.port: 9101}
    asserts:
      - equal:
          path: spec.ports
          value:
            - {name: stat, protocol: TCP, port: 9101, targetPort: 9101}

  - it: selects the HAProxy pods
    template: templates/haproxy-stats-service.yaml
    asserts:
      - equal:
          path: spec.selector
          value:
            app.kubernetes.io/name: haproxy
            app.kubernetes.io/instance: smoke

  - it: labels the HAProxy pods the way the stats Service selects them
    template: charts/haproxy/templates/deployment.yaml
    asserts:
      - isSubset:
          path: spec.template.metadata.labels
          content:
            app.kubernetes.io/name: haproxy
            app.kubernetes.io/instance: smoke

  # A haproxy.nameOverride renames the subchart's pod label; the selector has to follow it.
  - it: selects the HAProxy pods under haproxy.nameOverride
    template: templates/haproxy-stats-service.yaml
    set: {haproxy.nameOverride: lb}
    asserts:
      - equal:
          path: spec.selector["app.kubernetes.io/name"]
          value: lb

  - it: labels the HAProxy pods with haproxy.nameOverride
    template: charts/haproxy/templates/deployment.yaml
    set: {haproxy.nameOverride: lb}
    asserts:
      - equal:
          path: spec.template.metadata.labels["app.kubernetes.io/name"]
          value: lb

  # The haproxy dependency has no condition, so haproxy.enabled does not remove HAProxy, and
  # gating the Service on it would only stop vmagent from finding the running pods.
  - it: is rendered regardless of haproxy.enabled
    template: templates/haproxy-stats-service.yaml
    set: {haproxy.enabled: false}
    asserts:
      - hasDocuments:
          count: 1

  - it: is not rendered when stats are disabled
    template: templates/haproxy-stats-service.yaml
    set: {haproxy.monitoring.stats.enabled: false}
    asserts:
      - hasDocuments:
          count: 0

  - it: does not scrape HAProxy when stats are disabled
    template: templates/vmagent.yaml
    set: {haproxy.monitoring.stats.enabled: false}
    asserts:
      - notMatchRegex:
          path: spec.inlineScrapeConfig
          pattern: "job_name: 'haproxy'"
      - matchRegex:
          path: spec.inlineScrapeConfig
          pattern: "job_name: 'clickhouse'"

  - it: does not scrape HAProxy when the exporter is disabled
    template: templates/vmagent.yaml
    set: {haproxy.monitoring.prometheus.enabled: false}
    asserts:
      - notMatchRegex:
          path: spec.inlineScrapeConfig
          pattern: "job_name: 'haproxy'"

  - it: scrapes HAProxy through the stats Service, keeping the original service label
    template: templates/vmagent.yaml
    asserts:
      - equal:
          path: metadata.labels["app.kubernetes.io/component"]
          value: vmagent
      - matchRegex:
          path: spec.inlineScrapeConfig
          pattern: "(?s)job_name: 'haproxy'.*?regex: 'pmm-ha-haproxy-stats'\\n\\s+action: keep\\n.*?regex: 'stat'\\n\\s+action: keep\\n.*?target_label: service\\n\\s+replacement: pmm-ha-haproxy\\n.*?job_name: 'clickhouse'"
