# The log-streamer sidecars are rendered inside a range, where `.` is the log file: values must
# come through `$`. They share the PMM Server container's security context so the pod still
# meets the "restricted" Pod Security Standard with them enabled.
suite: pmm-ha log streamer
templates:
  - templates/statefulset.yaml
  - templates/configmap.yaml
  - templates/clickhouse-datasource-secret.yaml
release:
  name: smoke
  namespace: pmm
tests:
  - it: renders one sidecar per log file from the pinned image
    template: templates/statefulset.yaml
    set:
      logStreamer.enabled: true
    asserts:
      - notFailedTemplate: {}
      - equal:
          path: spec.template.spec.containers[?(@.name=="log-streamer-0")].image
          value: busybox:1.37.0
      - equal:
          path: spec.template.spec.containers[?(@.name=="log-streamer-1")].image
          value: busybox:1.37.0

  - it: gives the sidecars the PMM Server container security context
    template: templates/statefulset.yaml
    set:
      logStreamer.enabled: true
    asserts:
      - equal:
          path: spec.template.spec.containers[?(@.name=="log-streamer-0")].securityContext
          value:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false

  - it: renders no sidecar by default
    template: templates/statefulset.yaml
    asserts:
      - notExists:
          path: spec.template.spec.containers[?(@.name=="log-streamer-0")]
