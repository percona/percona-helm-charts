# Rejection cases for the value validators wired into statefulset.yaml.
#
# The suite renders statefulset.yaml alone on purpose. Every case is expected to abort in
# a validator, so nothing downstream matters - and keeping pg-user-credentials-secrets.yaml
# out means these run with no cluster and no dependency on Helm's template ordering.
#
# That scoping only works because every case here fails in the validator block at the top
# of statefulset.yaml. A `notFailedTemplate` case added to THIS suite errors instead of
# passing:
#
#   error calling include: template: no template "pmm-ha/templates/configmap.yaml"
#   associated with template "gotpl"
#
# because statefulset.yaml includes pmm.podAnnotations, which checksums configmap.yaml.
# Positive cases belong in ha-peers_test.yaml or data-retention_test.yaml, which list the
# extra templates.
suite: pmm-ha value validation
templates:
  - templates/statefulset.yaml
release:
  name: smoke
  namespace: pmm
tests:
  - it: rejects a replicas that is not a whole number
    set: {replicas: xyz}
    asserts:
      - failedTemplate:
          errorPattern: "replicas must be a whole number between 1 and 9999, got xyz"

  - it: rejects a negative replicas
    set: {replicas: -1}
    asserts:
      - failedTemplate:
          errorPattern: "replicas must be a whole number between 1 and 9999, got -1"

  - it: rejects replicas 0
    set: {replicas: 0}
    asserts:
      - failedTemplate:
          errorPattern: "replicas must be a whole number between 1 and 9999, got 0"

  # sprig's int parses base 0, so an accepted "010" would silently validate 8.
  - it: rejects a replicas with a leading zero
    set: {replicas: "010"}
    asserts:
      - failedTemplate:
          errorPattern: "replicas must be a whole number between 1 and 9999, got 010"

  # Anything wider than int64 overflows to 0 and would quote a value nobody typed.
  - it: rejects an oversized replicas
    set: {replicas: "99999999999999999999"}
    asserts:
      - failedTemplate:
          errorPattern: "got 99999999999999999999"

  # Raft elects by majority: an even count needs more votes without surviving more losses.
  - it: rejects an even replicas and suggests the neighbours
    set: {replicas: 2}
    asserts:
      - failedTemplate:
          errorPattern: "replicas must be odd, got 2.*Use 1 or 3\\."

  - it: suggests the neighbours of 4
    set: {replicas: 4}
    asserts:
      - failedTemplate:
          errorPattern: "got 4.*Use 3 or 5\\."

  # The hint must stay inside maxReplicas rather than name a value the next check rejects.
  - it: clamps the suggestion to maxReplicas
    set: {replicas: 10}
    asserts:
      - failedTemplate:
          errorPattern: "got 10.*Use 9\\."

  - it: reports the ceiling when neither neighbour fits
    set: {replicas: 12}
    asserts:
      - failedTemplate:
          errorPattern: "got 12.*maxReplicas is 10, so the largest supported value is 9\\."

  # Above maxReplicas a pod gets no server-template slot; if Raft leads there, HAProxy has
  # no UP backend at all.
  - it: rejects replicas above the default maxReplicas
    set: {replicas: 11}
    asserts:
      - failedTemplate:
          errorPattern: "replicas \\(11\\) exceeds maxReplicas \\(10\\)"

  - it: rejects replicas above an explicit maxReplicas
    set: {replicas: 5, maxReplicas: 3}
    asserts:
      - failedTemplate:
          errorPattern: "replicas \\(5\\) exceeds maxReplicas \\(3\\)"

  - it: rejects a maxReplicas that is not a whole number
    set: {maxReplicas: abc}
    asserts:
      - failedTemplate:
          errorPattern: "maxReplicas must be a whole number between 1 and 100, got abc"

  # 0 must reach the range check rather than being swallowed by a sprig default.
  - it: rejects maxReplicas 0
    set: {maxReplicas: 0}
    asserts:
      - failedTemplate:
          errorPattern: "maxReplicas must be a whole number between 1 and 100, got 0"

  - it: rejects a maxReplicas above the slot ceiling
    set: {maxReplicas: 200}
    asserts:
      - failedTemplate:
          errorPattern: "maxReplicas must be a whole number between 1 and 100, got 200"

  # The off-by-one, so a later "simplification" of ^([1-9][0-9]?|100)$ to [0-9]{1,3}
  # cannot quietly start rendering a 101-slot server-template.
  - it: rejects a maxReplicas one above the slot ceiling
    set: {maxReplicas: 101}
    asserts:
      - failedTemplate:
          errorPattern: "maxReplicas must be a whole number between 1 and 100, got 101"

  # Keeper is a Raft ensemble too; values.yaml has always said the count should be odd.
  - it: rejects an even Keeper count
    set: {clickhouse.keeper.replicasCount: 2}
    asserts:
      - failedTemplate:
          errorPattern: "clickhouse.keeper.replicasCount must be odd, got 2"

  - it: rejects Keeper count 0
    set: {clickhouse.keeper.replicasCount: 0}
    asserts:
      - failedTemplate:
          errorPattern: "clickhouse.keeper.replicasCount must be a whole number between 1 and 9999, got 0"

  # A nulled key must produce the validator's message, not a Go nil-pointer trace.
  - it: reports a nulled keeper block
    set: {clickhouse.keeper: null}
    asserts:
      - failedTemplate:
          errorPattern: "clickhouse.keeper.replicasCount must be a whole number between 1 and 9999, got <nil>"

  - it: reports a nulled clickhouse block
    set: {clickhouse: null}
    asserts:
      - failedTemplate:
          errorPattern: "clickhouse.keeper.replicasCount must be a whole number between 1 and 9999, got <nil>"

  # Keeper is bounded at 9: every node is a full Raft voter, so each extra pair widens
  # the majority every write waits on.
  - it: rejects a Keeper count above the supported maximum
    set: {clickhouse.keeper.replicasCount: 11}
    asserts:
      - failedTemplate:
          errorPattern: "clickhouse.keeper.replicasCount \\(11\\) exceeds the supported maximum \\(9\\)"

  - it: clamps the Keeper suggestion to the supported maximum
    set: {clickhouse.keeper.replicasCount: 10}
    asserts:
      - failedTemplate:
          errorPattern: "got 10.*Use 9\\."

  - it: reports the Keeper ceiling when neither neighbour fits
    set: {clickhouse.keeper.replicasCount: 12}
    asserts:
      - failedTemplate:
          errorPattern: "got 12.*The supported maximum is 9, so the largest supported value is 9\\."

  # Data retention. dataRetentionDays is the only place the period is set, so the two keys
  # that used to set it are rejected rather than silently ignored: either one would let
  # metrics and Query Analytics keep data for different periods.
  - it: rejects the retired vmstorage retentionPeriod
    set: {victoriaMetrics.vmstorage.retentionPeriod: 90d}
    asserts:
      - failedTemplate:
          errorPattern: "victoriaMetrics.vmstorage.retentionPeriod is no longer used"

  - it: rejects PMM_DATA_RETENTION in pmmEnv
    set: {pmmEnv.PMM_DATA_RETENTION: 2160h}
    asserts:
      - failedTemplate:
          errorPattern: "pmmEnv.PMM_DATA_RETENTION is derived by this chart"

  # Unset must fail rather than render a cluster whose retention nothing can set: PMM fixes
  # the period at start-up, so there is no runtime path to correct it afterwards.
  - it: rejects an unset dataRetentionDays
    set: {dataRetentionDays: null}
    asserts:
      - failedTemplate:
          errorPattern: "dataRetentionDays must be set to a whole number of days"

  - it: rejects dataRetentionDays 0
    set: {dataRetentionDays: 0}
    asserts:
      - failedTemplate:
          errorPattern: "must be a whole number of days greater than or equal to 1, got 0"

  - it: rejects a fractional dataRetentionDays
    set: {dataRetentionDays: 1.5}
    asserts:
      - failedTemplate:
          errorPattern: "must be a whole number of days greater than or equal to 1, got 1.5"

  # int true == 1, so the range check alone would accept a bool and silently mean one day.
  - it: rejects a boolean dataRetentionDays
    set: {dataRetentionDays: true}
    asserts:
      - failedTemplate:
          errorPattern: "must be a whole number of days, got the boolean true"

  # statefulset.yaml composes PMM_VM_URL as http://$(user):$(password)@host and PMM Server reads
  # the credential back with url.Parse, so the validator allowlists what url.Parse returns
  # unchanged there. The cases below are the shapes that fail differently.

  # Silently rewritten: url.Parse decodes the escape, so vmauth is handed "pAss".
  - it: rejects a VictoriaMetrics password that url.Parse percent-decodes
    set: {secret.victoriametrics_password: "p%41ss"}
    asserts:
      - failedTemplate:
          errorPattern: "The VictoriaMetrics password is not usable in PMM_VM_URL"

  # Rejected outright by url.Parse. An enumeration of the characters that change the value lets
  # these through, and the render then ships a PMM Server that cannot reach VictoriaMetrics.
  - it: rejects a VictoriaMetrics password that url.Parse refuses outright
    set: {secret.victoriametrics_password: "p[ass"}
    asserts:
      - failedTemplate:
          errorPattern: "The VictoriaMetrics password is not usable in PMM_VM_URL"

  # Non-ASCII fails url.Parse the same way, and no list of bad ASCII characters reaches it.
  - it: rejects a non-ASCII VictoriaMetrics password
    set: {secret.victoriametrics_password: "pässwörd"}
    asserts:
      - failedTemplate:
          errorPattern: "The VictoriaMetrics password is not usable in PMM_VM_URL"

  # ':' splits the userinfo, so the rest of the username arrives as the start of the password.
  - it: rejects a VictoriaMetrics username carrying a colon
    set: {secret.victoriametrics_user: "us:er"}
    asserts:
      - failedTemplate:
          errorPattern: "The VictoriaMetrics username is not usable in PMM_VM_URL"

  - it: rejects a VictoriaMetrics username that url.Parse refuses outright
    set: {secret.victoriametrics_user: "us|er"}
    asserts:
      - failedTemplate:
          errorPattern: "The VictoriaMetrics username is not usable in PMM_VM_URL"
