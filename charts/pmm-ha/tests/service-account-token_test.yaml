# Pods that never call the Kubernetes API must not carry a ServiceAccount token.
suite: pmm-ha ServiceAccount token automount
templates:
  - templates/statefulset.yaml
  - templates/pmm-client-statefulset.yaml
  - templates/clickhouse-cluster.yaml
  - templates/clickhouse-keeper.yaml
  - templates/configmap.yaml
  - templates/clickhouse-datasource-secret.yaml
release:
  name: pmm-ha
  namespace: pmm
tests:
  - it: keeps the token out of PMM Server
    template: templates/statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: keeps the token out of PMM Client
    template: templates/pmm-client-statefulset.yaml
    asserts:
      - equal:
          path: spec.template.spec.automountServiceAccountToken
          value: false

  - it: keeps the token out of ClickHouse
    template: templates/clickhouse-cluster.yaml
    asserts:
      - equal:
          path: spec.templates.podTemplates[?(@.name=="clickhouse-pod-template")].spec.automountServiceAccountToken
          value: false

  - it: keeps the token out of ClickHouse Keeper
    template: templates/clickhouse-keeper.yaml
    asserts:
      - equal:
          path: spec.templates.podTemplates[?(@.name=="keeper-pod-template")].spec.automountServiceAccountToken
          value: false
