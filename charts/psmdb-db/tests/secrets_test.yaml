suite: psmdb-db secrets
release:
  name: unit
  namespace: test-ns
tests:
  - it: does not render a database password secret by default
    template: templates/cluster-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the database password secret when credentials are provided
    template: templates/cluster-secret.yaml
    set:
      systemUsers:
        MONGODB_BACKUP_USER: backup
        MONGODB_BACKUP_PASSWORD: backup123456
        MONGODB_DATABASE_ADMIN_USER: databaseAdmin
        MONGODB_DATABASE_ADMIN_PASSWORD: databaseAdmin123456
        MONGODB_CLUSTER_ADMIN_USER: clusterAdmin
        MONGODB_CLUSTER_ADMIN_PASSWORD: clusterAdmin123456
        MONGODB_CLUSTER_MONITOR_USER: clusterMonitor
        MONGODB_CLUSTER_MONITOR_PASSWORD: clusterMonitor123456
        MONGODB_USER_ADMIN_USER: userAdmin
        MONGODB_USER_ADMIN_PASSWORD: userAdmin123456
        PMM_SERVER_API_KEY: apikey
    asserts:
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: unit-psmdb-db-secrets
      - equal:
          path: metadata.namespace
          value: test-ns
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: psmdb-db
            app.kubernetes.io/instance: unit
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData
          value:
            MONGODB_BACKUP_USER: backup
            MONGODB_BACKUP_PASSWORD: backup123456
            MONGODB_DATABASE_ADMIN_USER: databaseAdmin
            MONGODB_DATABASE_ADMIN_PASSWORD: databaseAdmin123456
            MONGODB_CLUSTER_ADMIN_USER: clusterAdmin
            MONGODB_CLUSTER_ADMIN_PASSWORD: clusterAdmin123456
            MONGODB_CLUSTER_MONITOR_USER: clusterMonitor
            MONGODB_CLUSTER_MONITOR_PASSWORD: clusterMonitor123456
            MONGODB_USER_ADMIN_USER: userAdmin
            MONGODB_USER_ADMIN_PASSWORD: userAdmin123456
            PMM_SERVER_API_KEY: apikey
