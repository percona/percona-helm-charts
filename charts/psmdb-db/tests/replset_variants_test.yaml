suite: psmdb-db replica set variants
templates:
  - templates/cluster.yaml
release:
  name: unit
tests:
  - it: uses the values key as the replica set name and evaluates configuration templates
    set:
      replsets.rs0.name: ""
      replsets.rs0.configuration: |-
        operationProfiling:
          mode: {{ .Release.Name }}
      replsets.rs0.externalNodes:
        - host: mongo.example
          port: 27017
      replsets.rs0.hookScript.configMapRef.name: mongo-hooks
      replsets.rs0.splitHorizons:
        mongo.example: external.example
      replsets.rs0.primaryPreferTagSelector:
        region: east
    asserts:
      - equal:
          path: spec.replsets[0].name
          value: rs0
      - equal:
          path: spec.replsets[0].configuration
          value: |
            operationProfiling:
              mode: unit
      - equal:
          path: spec.replsets[0].externalNodes[0]
          value:
            host: mongo.example
            port: 27017
      - equal:
          path: spec.replsets[0].hookScript.configMapRef.name
          value: mongo-hooks
      - equal:
          path: spec.replsets[0].splitHorizons
          value:
            mongo.example: external.example
      - equal:
          path: spec.replsets[0].primaryPreferTagSelector
          value:
            region: east

  - it: chooses hostPath over the default PVC
    set:
      replsets.rs0.volumeSpec.hostPath:
        path: /mongo-data
        type: DirectoryOrCreate
    asserts:
      - equal:
          path: spec.replsets[0].volumeSpec
          value:
            hostPath:
              path: /mongo-data
              type: DirectoryOrCreate

  - it: renders emptyDir after the default PVC is removed
    values:
      - values/replset-emptydir.yaml
    asserts:
      - equal:
          path: spec.replsets[0].volumeSpec
          value:
            emptyDir: {}

  - it: renders settings for hidden nonvoting and arbiter members
    set:
      replsets.rs0.hidden.enabled: true
      replsets.rs0.hidden.configuration: |-
        operationProfiling:
          mode: slowOp
      replsets.rs0.hidden.sidecars:
        - name: metrics
          image: example/metrics:1
      replsets.rs0.nonvoting.enabled: true
      replsets.rs0.nonvoting.serviceAccountName: mongo-nonvoting
      replsets.rs0.nonvoting.volumeSpec.hostPath.path: /nonvoting-data
      replsets.rs0.arbiter.enabled: true
      replsets.rs0.arbiter.env:
        - name: ARBITER_TEST
          value: "1"
    asserts:
      - equal:
          path: spec.replsets[0].hidden.configuration
          value: |
            operationProfiling:
              mode: slowOp
      - equal:
          path: spec.replsets[0].hidden.sidecars
          value:
            - name: metrics
              image: example/metrics:1
      - equal:
          path: spec.replsets[0].nonvoting.serviceAccountName
          value: mongo-nonvoting
      - equal:
          path: spec.replsets[0].nonvoting.volumeSpec
          value:
            hostPath:
              path: /nonvoting-data
              type: Directory
      - equal:
          path: spec.replsets[0].arbiter.env
          value:
            - name: ARBITER_TEST
              value: "1"
