suite: psmdb-db ClusterSync source secret
templates:
  - templates/clustersync-secret.yaml
release:
  name: unit
  namespace: test-ns
tests:
  - it: omits the source secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: leaves an external source secret unmanaged
    set:
      clusterSync.enabled: true
      clusterSync.source.credentialsSecret: external-source
    asserts:
      - hasDocuments:
          count: 0

  - it: creates a source secret from inline credentials
    set:
      clusterSync.enabled: true
      clusterSync.name: custom-sync
      clusterSync.source.credentials.username: source-user
      clusterSync.source.credentials.password: secret-pass
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: kind
          value: Secret
      - equal:
          path: metadata.name
          value: custom-sync-source
      - equal:
          path: metadata.namespace
          value: test-ns
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData
          value:
            username: source-user
            password: secret-pass

  - it: rejects incomplete inline credentials
    set:
      clusterSync.enabled: true
      clusterSync.source.credentials.username: source-user
    asserts:
      - failedTemplate:
          errorPattern: clusterSync.source.credentials.password is required when credentials are inlined
