suite: ps-db logcollector
templates:
  - templates/cluster.yaml
release:
  name: unit
  namespace: test-ns
tests:
  - it: renders enabled logcollector by default
    asserts:
      - matchRegex:
          path: spec.logcollector.image
          pattern: '^percona/fluentbit:.+$'
      - equal:
          path: spec.logcollector.enabled
          value: true
      - notExists:
          path: spec.logcollector.configuration

  - it: renders disabled logcollector
    set:
      logcollector.enabled: false
    asserts:
      - matchRegex:
          path: spec.logcollector.image
          pattern: '^percona/fluentbit:.+$'
      - equal:
          path: spec.logcollector.enabled
          value: false

  - it: renders changed default logcollector values
    values:
      - values/logcollector-changed-defaults.yaml
    asserts:
      - equal:
          path: spec.logcollector
          value:
            enabled: true
            image: changed-image:changed-tag
            imagePullPolicy: IfNotPresent
            configuration: |
              pipeline:
                filters:
                  - name: record_modifier
                    match: "*"
            env:
              - name: LOG_ENV
                value: test
            envFrom:
              - secretRef:
                  name: logcollector-env
            containerSecurityContext:
              privileged: false
            resources:
              requests:
                cpu: 1m
                memory: 1Mi
              limits:
                cpu: 2m
                memory: 2Mi
            readinessProbe:
              initialDelaySeconds: 5
            livenessProbe:
              initialDelaySeconds: 30
            volumeMounts:
              - name: extra
                mountPath: /extra
            volumes:
              - name: extra
                emptyDir: {}
            logRotate:
              schedule: "0 0 * * *"
              configuration: |
                /var/lib/mysql/log/*.log {
                    daily
                }
              extraConfig:
                name: my-logrotate-config
              readinessProbe:
                initialDelaySeconds: 5
              livenessProbe:
                initialDelaySeconds: 30
