suite: ps-db rbac
release:
  name: unit
  namespace: test-ns
tests:
  - it: renders the orchestrator role
    templates:
      - templates/role.yaml
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Role
      - equal:
          path: metadata.name
          value: unit-ps-db-orchestrator
      - equal:
          path: metadata.namespace
          value: test-ns
      - equal:
          path: rules
          value:
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - list
                - patch
            - apiGroups:
                - ps.percona.com
              resources:
                - perconaservermysqls
              verbs:
                - get

  - it: renders the orchestrator service account and role binding
    templates:
      - templates/role-binding.yaml
    asserts:
      - hasDocuments:
          count: 2
      - isKind:
          of: ServiceAccount
        documentIndex: 0
      - equal:
          path: metadata.name
          value: unit-ps-db-orchestrator
        documentIndex: 0
      - isKind:
          of: RoleBinding
        documentIndex: 1
      - equal:
          path: roleRef
          value:
            apiGroup: rbac.authorization.k8s.io
            kind: Role
            name: unit-ps-db-orchestrator
        documentIndex: 1
      - equal:
          path: subjects
          value:
            - kind: ServiceAccount
              name: unit-ps-db-orchestrator
        documentIndex: 1
