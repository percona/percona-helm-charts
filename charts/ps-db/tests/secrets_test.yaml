suite: ps-db secrets
templates:
  - templates/cluster-secret.yaml
release:
  name: unit
  namespace: test-ns
tests:
  - it: does not render a database password secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the database password secret when passwords are provided
    set:
      passwords:
        root: root
        xtrabackup: xbackup
        monitor: monitor
        operator: operator
        replication: repl
        orchestrator: orc
        heartbeat: heartbeat
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: unit-ps-db-secrets
      - equal:
          path: metadata.namespace
          value: test-ns
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: ps-db
            app.kubernetes.io/instance: unit
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData
          value:
            root: root
            xtrabackup: xbackup
            monitor: monitor
            operator: operator
            replication: repl
            orchestrator: orc
            heartbeat: heartbeat

  - it: uses secretsName for the secret name
    set:
      secretsName: custom-secrets
      passwords.root: root
    asserts:
      - equal:
          path: metadata.name
          value: custom-secrets

  - it: uses the default secret name when secretsName is empty
    set:
      secretsName: ""
      passwords.root: root
    asserts:
      - equal:
          path: metadata.name
          value: unit-ps-db-secrets
