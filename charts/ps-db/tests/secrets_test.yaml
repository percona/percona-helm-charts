suite: ps-db secrets
release:
  name: unit
  namespace: test-ns
tests:
  - it: does not render a database password secret by default
    template: templates/cluster-secret.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the database password secret
    template: templates/cluster-secret.yaml
    set:
      passwords:
        root: root-password
        xtrabackup: backup-password
        monitor: monitor-password
        operator: operator-password
        replication: replication-password
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: unit-ps-db-secrets
      - equal:
          path: metadata.namespace
          value: test-ns
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: ps-db
            app.kubernetes.io/instance: unit
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData
          value:
            root: root-password
            xtrabackup: backup-password
            monitor: monitor-password
            operator: operator-password
            replication: replication-password

  - it: renders a custom secret name
    template: templates/cluster-secret.yaml
    set:
      secretsName: custom-secret
      passwords.root: root-password
    asserts:
      - equal:
          path: metadata.name
          value: custom-secret
