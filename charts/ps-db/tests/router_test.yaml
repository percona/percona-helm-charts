suite: ps-db router
templates:
  - templates/cluster.yaml
release:
  name: unit
  namespace: test-ns
tests:
  - it: renders disabled router by default
    asserts:
      - matchRegex:
          path: spec.proxy.router.image
          pattern: '^percona/percona-mysql-router:.+$'
      - isSubset:
          path: spec.proxy.router
          content:
            size: 3
            gracePeriod: 30
            enabled: false
      - notExists:
          path: spec.proxy.router.resources

  - it: renders changed default router values with group replication
    values:
      - values/router-changed-defaults.yaml
    asserts:
      - equal:
          path: spec.proxy.router
          value:
            size: 5
            gracePeriod: 60
            enabled: true
            image: changed-image:changed-tag
            imagePullPolicy: IfNotPresent
            ports:
              - name: http
                port: 8443
                targetPort: 0
              - name: custom-port
                port: 1111
                targetPort: 6446
            imagePullSecrets:
              - name: pull-secret
            initContainer:
              image: custom-init:tag
              resources:
                limits:
                  cpu: 5m
            podDisruptionBudget:
              minAvailable: 1
            topologySpreadConstraints:
              - maxSkew: 1
                topologyKey: kubernetes.io/hostname
                whenUnsatisfiable: DoNotSchedule
            env:
              - name: MY_ENV
                value: "1000"
            envFrom:
              - secretRef:
                  name: my-env-secret
            startupProbe:
              timeoutSeconds: 43200
            livenessProbe:
              timeoutSeconds: 4
            readinessProbe:
              timeoutSeconds: 3
            configuration: |
              [logger]
              level=DEBUG
            priorityClassName: high-priority
            annotations:
              test: annotation
            labels:
              test: label
            tolerations:
              - key: test
                operator: Exists
                effect: NoSchedule
            nodeSelector:
              disktype: ssd
            resources:
              requests:
                memory: 1Mi
              limits:
                memory: 2Mi
            schedulerName: custom-scheduler
            containerSecurityContext:
              privileged: false
            podSecurityContext:
              fsGroup: 1001
            serviceAccountName: workload-sa
            runtimeClassName: image-rc
            expose:
              type: LoadBalancer

  - it: forces router disabled for async replication
    set:
      mysql.clusterType: async
      proxy.router.enabled: true
    asserts:
      - equal:
          path: spec.proxy.router.enabled
          value: false
      - notExists:
          path: spec.proxy.router.resources
