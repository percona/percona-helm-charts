suite: ps-db cluster
templates:
  - templates/cluster.yaml
release:
  name: unit
  namespace: test-ns
tests:
  - it: renders the default cluster metadata and top-level spec
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: PerconaServerMySQL
      - isAPIVersion:
          of: ps.percona.com/v1
      - equal:
          path: metadata.name
          value: unit-ps-db
      - equal:
          path: metadata.namespace
          value: test-ns
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: ps-db
            app.kubernetes.io/instance: unit
            app.kubernetes.io/managed-by: Helm
      - equal:
          path: metadata.finalizers
          value:
            - percona.com/delete-mysql-pods-in-order
      - matchRegex:
          path: spec.crVersion
          pattern: '^\d+\.\d+\.\d+$'
      - isSubset:
          path: spec
          content:
            updateStrategy: SmartUpdate
            upgradeOptions:
              versionServiceEndpoint: https://check.percona.com
              apply: disabled
            secretsName: unit-ps-db-secrets
            sslSecretName: unit-ps-db-ssl
      - matchRegex:
          path: spec.toolkit.image
          pattern: '^percona/percona-toolkit:.+$'
      - isSubset:
          path: spec.toolkit
          content:
            imagePullPolicy: Always
            resources:
              requests: {}
              limits: {}
      - notExists:
          path: spec.metadata
      - notExists:
          path: spec.pause
      - notExists:
          path: spec.tls
      - notExists:
          path: spec.initContainer
      - notExists:
          path: spec.unsafeFlags
      - notExists:
          path: spec.storageScaling
      - notExists:
          path: spec.enableVolumeExpansion
      - notExists:
          path: spec.users

  - it: renders changed default cluster values
    values:
      - values/cluster-changed-defaults.yaml
    asserts:
      - equal:
          path: metadata.finalizers
          value:
            - percona.com/delete-mysql-pods-in-order
            - percona.com/delete-ssl
      - isSubset:
          path: spec
          content:
            metadata:
              annotations:
                test: annotation
              labels:
                test: label
            crVersion: 1.2.0
            enableVolumeExpansion: true
            storageScaling:
              enableVolumeScaling: true
              enableExternalAutoscaling: true
              autoscaling:
                enabled: true
                triggerThresholdPercent: 80
                growthStep: 2Gi
                maxSize: 100Gi
            unsafeFlags:
              mysqlSize: true
              proxy: true
            updateStrategy: OnDelete
            upgradeOptions:
              versionServiceEndpoint: https://custom.example.com
              apply: 8.4-recommended
            pause: true
            secretsName: custom-secrets
            sslSecretName: custom-ssl
            tls:
              SANs:
                - mysql-1.example.com
              issuerConf:
                name: custom-issuer
                kind: ClusterIssuer
                group: cert-manager.io
            ignoreAnnotations:
              - service.beta.kubernetes.io/aws-load-balancer-backend-protocol
            ignoreLabels:
              - rack
            toolkit:
              image: changed-toolkit:changed-tag
              imagePullPolicy: IfNotPresent
              resources:
                requests:
                  cpu: 3m
                  memory: 3Mi
                limits:
                  cpu: 4m
                  memory: 4Mi
      - equal:
          path: spec.initContainer
          value:
            image: custom-init:tag
            containerSecurityContext:
              privileged: false
              runAsUser: 1001
            resources:
              requests:
                cpu: 1m
                memory: 1Mi
              limits:
                cpu: 2m
                memory: 2Mi

  - it: omits empty or unset init container images so the operator picks its default
    set:
      initContainer.image: ""
      initContainer.resources.requests.cpu: 1m
      mysql.initContainer.resources.requests.cpu: 1m
      proxy.haproxy.initContainer.resources.requests.cpu: 1m
      proxy.router.enabled: true
      proxy.router.initContainer.resources.requests.cpu: 1m
      backup.initContainer.resources.requests.cpu: 1m
    asserts:
      - equal:
          path: spec.initContainer
          value:
            resources:
              requests:
                cpu: 1m
      - equal:
          path: spec.mysql.initContainer
          value:
            resources:
              requests:
                cpu: 1m
      - equal:
          path: spec.proxy.haproxy.initContainer
          value:
            resources:
              requests:
                cpu: 1m
      - equal:
          path: spec.proxy.router.initContainer
          value:
            resources:
              requests:
                cpu: 1m
      - equal:
          path: spec.backup.initContainer
          value:
            resources:
              requests:
                cpu: 1m

  - it: omits an unset orchestrator init container image
    set:
      mysql.clusterType: async
      orchestrator.enabled: true
      orchestrator.initContainer.resources.requests.cpu: 1m
    asserts:
      - equal:
          path: spec.orchestrator.initContainer
          value:
            resources:
              requests:
                cpu: 1m

  - it: omits init containers that have no fields to render
    set:
      initContainer.image: ""
      mysql.initContainer.image: ""
      proxy.haproxy.initContainer.resources.foo: bar
      proxy.router.enabled: true
      proxy.router.initContainer.image: ""
      backup.initContainer.image: ""
      mysql.clusterType: async
      orchestrator.enabled: true
      orchestrator.initContainer.image: ""
    asserts:
      - notExists:
          path: spec.initContainer
      - notExists:
          path: spec.mysql.initContainer
      - notExists:
          path: spec.proxy.haproxy.initContainer
      - notExists:
          path: spec.proxy.router.initContainer
      - notExists:
          path: spec.backup.initContainer
      - notExists:
          path: spec.orchestrator.initContainer

  - it: truncates the cluster name to 21 characters
    release:
      name: my-very-long-release
    asserts:
      - equal:
          path: metadata.name
          value: my-very-long-release
      - equal:
          path: spec.secretsName
          value: my-very-long-release-secrets
      - equal:
          path: spec.sslSecretName
          value: my-very-long-release-ssl

  - it: uses the release name when it contains the chart name
    release:
      name: my-ps-db
    asserts:
      - equal:
          path: metadata.name
          value: my-ps-db

  - it: renders fullnameOverride
    set:
      fullnameOverride: cluster1
    asserts:
      - equal:
          path: metadata.name
          value: cluster1
      - equal:
          path: spec.secretsName
          value: cluster1-secrets

  - it: renders custom users when defined
    set:
      users:
        - name: my-user
          dbs:
            - db1
          hosts:
            - localhost
          grants:
            - SELECT
          withGrantOption: true
          passwordSecretRef:
            name: my-user-pwd
            key: my-user-pwd-key
    asserts:
      - equal:
          path: spec.users
          value:
            - name: my-user
              dbs:
                - db1
              hosts:
                - localhost
              grants:
                - SELECT
              withGrantOption: true
              passwordSecretRef:
                name: my-user-pwd
                key: my-user-pwd-key
