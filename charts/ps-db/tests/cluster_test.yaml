suite: ps-db cluster
templates:
  - templates/cluster.yaml
release:
  name: unit
  namespace: test-ns
tests:
  - it: renders the default cluster
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: apiVersion
          value: ps.percona.com/v1
      - equal:
          path: kind
          value: PerconaServerMySQL
      - isSubset:
          path: metadata
          content:
            name: unit-ps-db
            namespace: test-ns
            finalizers:
              - percona.com/delete-mysql-pods-in-order
      - isSubset:
          path: metadata.labels
          content:
            app.kubernetes.io/name: ps-db
            app.kubernetes.io/instance: unit
            app.kubernetes.io/managed-by: Helm
      - isSubset:
          path: spec
          content:
            updateStrategy: SmartUpdate
            upgradeOptions:
              versionServiceEndpoint: https://check.percona.com
              apply: disabled
            secretsName: unit-ps-db-secrets
            sslSecretName: unit-ps-db-ssl
      - matchRegex:
          path: spec.crVersion
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'

  - it: renders changed cluster values
    values:
      - values/cluster-changed-defaults.yaml
    asserts:
      - isSubset:
          path: spec
          content:
            crVersion: 9.9.9
            enableVolumeExpansion: true
            updateStrategy: RollingUpdate
            upgradeOptions:
              versionServiceEndpoint: https://versions.test
              apply: recommended
            pause: true
            secretsName: custom-secrets
            sslSecretName: custom-ssl
      - equal:
          path: metadata.finalizers
          value:
            - percona.com/delete-mysql-pvc
      - equal:
          path: spec.metadata
          value:
            labels:
              rack: rack-22
            annotations:
              team: database
      - equal:
          path: spec.unsafeFlags
          value:
            mysqlSize: true
            orchestrator: true
            orchestratorSize: true
            proxy: true
            proxySize: true
      - equal:
          path: spec.storageScaling
          value:
            enableVolumeScaling: true
            enableExternalAutoscaling: false
            autoscaling:
              enabled: true
              triggerThresholdPercent: 75
              growthStep: 2Gi
              maxSize: 20Gi
      - equal:
          path: spec.tls
          value:
            SANs:
              - mysql.example.com
            issuerConf:
              name: custom-issuer
              kind: ClusterIssuer
              group: cert-manager.io

  - it: renders init container settings
    set:
      initContainer.image: custom-init:1
      initContainer.containerSecurityContext.runAsUser: 1001
      initContainer.resources.requests.cpu: 100m
      initContainer.resources.limits.memory: 200Mi
    asserts:
      - equal:
          path: spec.initContainer
          value:
            image: custom-init:1
            containerSecurityContext:
              runAsUser: 1001
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 200Mi

  - it: uses the operator image for init containers by default
    set:
      initContainer.containerSecurityContext.runAsUser: 1001
    asserts:
      - matchRegex:
          path: spec.initContainer.image
          pattern: '^percona/percona-server-mysql-operator:.+$'

  - it: renders ignore lists
    set:
      ignoreAnnotations:
        - iam.amazonaws.com/role
      ignoreLabels:
        - rack
    asserts:
      - equal:
          path: spec.ignoreAnnotations
          value:
            - iam.amazonaws.com/role
      - equal:
          path: spec.ignoreLabels
          value:
            - rack

  - it: preserves disabled storage scaling options
    set:
      storageScaling:
        enableVolumeScaling: false
        enableExternalAutoscaling: false
        autoscaling:
          enabled: false
    asserts:
      - equal:
          path: spec.storageScaling
          value:
            enableVolumeScaling: false
            enableExternalAutoscaling: false
            autoscaling:
              enabled: false
