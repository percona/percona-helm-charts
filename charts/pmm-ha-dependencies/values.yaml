## @section PMM HA Dependencies
## This chart installs the Kubernetes operators required for PMM HA deployment
## It must be installed before deploying the pmm-ha chart

## @section VictoriaMetrics Operator Configuration  
## The victoria-metrics-operator manages VictoriaMetrics resources
victoria-metrics-operator:
  enabled: true
  crds:
    enabled: true
  admissionWebhooks:
    # Enable admission webhooks for validation
    enabled: true

## @section Altinity ClickHouse Operator Configuration
## The altinity-clickhouse-operator manages ClickHouse clusters
altinity-clickhouse-operator:
  enabled: true
  # The operator's RBAC is already cluster-wide (rbac.namespaceScoped defaults to false),
  # but by default it watches only its own namespace, so ClickHouseInstallations in other
  # namespaces of the cluster are never reconciled. WATCH_NAMESPACES=".*" makes it watch
  # every namespace.
  #
  # Why a regexp and not an empty list: leaving the watch list empty does NOT mean "all
  # namespaces" here. Per applyDefaultWatchNamespace() upstream, the operator only infers
  # "all" when it runs in kube-system; installed anywhere else it pins the watch list to its
  # own namespace. GetInformerNamespace() returns NamespaceAll unless the include list holds
  # exactly one entry matching the DNS-label regexp — ".*" fails that check, so the informers
  # stay cluster-wide and reconciliation is then narrowed by the regexp filter.
  #
  # Do NOT swap ".*" for a plain namespace list to "scope" it: a single plain name (len == 1,
  # matches the label regexp) scopes the operator to that namespace ONLY — it stops watching
  # its own namespace and the primary install breaks. If you must restrict it, use two or more
  # entries AND include the operator's own namespace (this still needs cluster-wide list/watch
  # RBAC).
  operator:
    env:
      - name: WATCH_NAMESPACES
        value: ".*"
  # The metrics-exporter sidecar reads its own env, not the operator's, and uses the same
  # GetInformerNamespace() logic — so mirror the setting here, or a ClickHouseInstallation in a
  # non-operator namespace stays unmonitored until the next reconcile pushes it to the exporter.
  metrics:
    env:
      - name: WATCH_NAMESPACES
        value: ".*"
  # fullnameOverride: clickhouse-op  # Uncomment to shorten resource names if hitting 63-char limit

## @section PostgreSQL Operator Configuration
## The pg-operator manages PostgreSQL clusters
pg-operator:
  enabled: true
  # Watch ALL namespaces so PostgreSQL clusters created in other namespaces of the
  # cluster are reconciled. This also switches the operator
  # RBAC from a namespaced Role/RoleBinding to a ClusterRole/ClusterRoleBinding. Matches
  # the VictoriaMetrics operator, which is already cluster-scoped. (Subchart default is
  # false = the operator watches only its own namespace.)
  watchAllNamespaces: true
