suite: psmdb-operator CRDs
templates:
  - templates/perconaservermongodbs.psmdb.percona.com.yaml
  - templates/perconaservermongodbbackups.psmdb.percona.com.yaml
  - templates/perconaservermongodbrestores.psmdb.percona.com.yaml
  - templates/perconaservermongodbclustersyncs.psmdb.percona.com.yaml
tests:
  - it: renders the PerconaServerMongoDB CRD
    template: templates/perconaservermongodbs.psmdb.percona.com.yaml
    asserts:
      - isKind:
          of: CustomResourceDefinition
      - equal:
          path: metadata.name
          value: perconaservermongodbs.psmdb.percona.com
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - matchRegex:
          path: metadata.labels["app.kubernetes.io/version"]
          pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - equal:
          path: spec.group
          value: psmdb.percona.com
      - equal:
          path: spec.names.kind
          value: PerconaServerMongoDB
      - equal:
          path: spec.names.plural
          value: perconaservermongodbs
      - equal:
          path: spec.scope
          value: Namespaced
      - exists:
          path: spec.versions

  - it: renders the backup CRD
    template: templates/perconaservermongodbbackups.psmdb.percona.com.yaml
    asserts:
      - isKind:
          of: CustomResourceDefinition
      - equal:
          path: metadata.name
          value: perconaservermongodbbackups.psmdb.percona.com
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.names.kind
          value: PerconaServerMongoDBBackup
      - equal:
          path: spec.names.plural
          value: perconaservermongodbbackups
      - equal:
          path: spec.versions[0].name
          value: v1
      - equal:
          path: spec.versions[0].served
          value: true
      - equal:
          path: spec.versions[0].storage
          value: true
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema

  - it: renders the restore CRD
    template: templates/perconaservermongodbrestores.psmdb.percona.com.yaml
    asserts:
      - isKind:
          of: CustomResourceDefinition
      - equal:
          path: metadata.name
          value: perconaservermongodbrestores.psmdb.percona.com
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.names.kind
          value: PerconaServerMongoDBRestore
      - equal:
          path: spec.names.plural
          value: perconaservermongodbrestores
      - equal:
          path: spec.versions[0].name
          value: v1
      - equal:
          path: spec.versions[0].served
          value: true
      - equal:
          path: spec.versions[0].storage
          value: true
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema

  - it: renders the cluster sync CRD
    template: templates/perconaservermongodbclustersyncs.psmdb.percona.com.yaml
    asserts:
      - isKind:
          of: CustomResourceDefinition
      - equal:
          path: metadata.name
          value: perconaservermongodbclustersyncs.psmdb.percona.com
      - equal:
          path: metadata.annotations["helm.sh/resource-policy"]
          value: keep
      - equal:
          path: spec.names.kind
          value: PerconaServerMongoDBClusterSync
      - equal:
          path: spec.names.plural
          value: perconaservermongodbclustersyncs
      - equal:
          path: spec.versions[0].name
          value: v1
      - equal:
          path: spec.versions[0].served
          value: true
      - equal:
          path: spec.versions[0].storage
          value: true
      - exists:
          path: spec.versions[0].schema.openAPIV3Schema

  - it: omits the keep policy when CRD preservation is disabled
    set:
      preserveCrds: false
    asserts:
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]
        template: templates/perconaservermongodbs.psmdb.percona.com.yaml
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]
        template: templates/perconaservermongodbbackups.psmdb.percona.com.yaml
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]
        template: templates/perconaservermongodbrestores.psmdb.percona.com.yaml
      - notExists:
          path: metadata.annotations["helm.sh/resource-policy"]
        template: templates/perconaservermongodbclustersyncs.psmdb.percona.com.yaml
