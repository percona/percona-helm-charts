# Control-plane is tainted NoSchedule once workers exist. Clear it so all
# three nodes can schedule a size-3 cluster with hostname anti-affinity.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          taints: []
  - role: worker
  - role: worker
