unsafeFlags:
  pxcSize: true
  proxySize: true

pxc:
  size: 3
  affinity:
    antiAffinityTopologyKey: none
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
  persistence:
    size: 2Gi

haproxy:
  enabled: true
  size: 3
  affinity:
    antiAffinityTopologyKey: none
  resources:
    requests:
      cpu: 100m
      memory: 128Mi

proxysql:
  enabled: false
