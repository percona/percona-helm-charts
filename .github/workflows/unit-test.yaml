name: Helm Unit Tests

on:
  pull_request:
    paths:
    - 'charts/pxc-operator/**'
    - 'charts/pxc-db/**'
    - 'charts/ps-operator/**'
    - 'charts/ps-db/**'
    - 'Makefile'
    - '.github/workflows/unit-test.yaml'

jobs:
  detect:
    name: Detect changed charts
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      charts: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            common: &common
              - 'Makefile'
              - '.github/workflows/unit-test.yaml'
            pxc-operator: [*common, 'charts/pxc-operator/**']
            pxc-db: [*common, 'charts/pxc-db/**']
            ps-operator: [*common, 'charts/ps-operator/**']
            ps-db: [*common, 'charts/ps-db/**']

  unit-test:
    name: Helm Unit Tests (test-${{ matrix.chart }})
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        chart: ${{ fromJson(needs.detect.outputs.charts) }}
        exclude:
          - chart: common
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.0
        with:
          version: v3.21.0

      - name: Install helm-unittest plugin
        run: make helm-unittest

      - name: Run test-${{ matrix.chart }}
        run: make test-${{ matrix.chart }}
