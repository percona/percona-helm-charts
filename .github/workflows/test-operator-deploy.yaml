name: operator-test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/psmdb-operator/**'
      - '!charts/psmdb-operator/crds/**'
      - 'charts/psmdb-operator-crds/**'
      - 'charts/psmdb-db/**'
      - 'charts/pxc-operator/**'
      - 'charts/pxc-operator-crds/**'
      - 'charts/pxc-db/**'
      - 'charts/ps-operator/**'
      - 'charts/ps-operator-crds/**'
      - 'charts/ps-db/**'
      - 'charts/pg-operator/**'
      - 'charts/pg-operator-crds/**'
      - 'charts/pg-db/**'
      - '.github/workflows/test-operator-deploy.yaml'
      - '.github/workflows/scripts/collect-cluster-logs'
      - '.github/workflows/scripts/detect-changes'
      - '.github/workflows/scripts/detect-comment'
      - '.github/workflows/scripts/test-operator-deploy'
      - '.github/workflows/files/minimal-*-values.yaml'
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  SUPPORTED_CHARTS: psmdb-operator,psmdb-operator-crds,psmdb-db
  SUPPORTED_JOBS: install,upgrade
  SELECT_ALL_ON_CHANGES: >-
    .github/workflows/test-operator-deploy.yaml,
    .github/workflows/scripts/collect-cluster-logs,
    .github/workflows/scripts/detect-changes,
    .github/workflows/scripts/detect-comment,
    .github/workflows/scripts/test-operator-deploy,
    .github/workflows/files/minimal-psmdb-values.yaml,
    .github/workflows/files/minimal-ps-values.yaml,
    .github/workflows/files/minimal-pxc-values.yaml,
    .github/workflows/files/minimal-pg-values.yaml

jobs:
  install-test:
    name: install-${{ matrix.product }}
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER') &&
       startsWith(github.event.comment.body, '/run-test-upgrade'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        product: [psmdb, pxc, ps, pg]
    env:
      SUPPORTED_CHARTS: psmdb-operator,psmdb-operator-crds,psmdb-db,pxc-operator,pxc-operator-crds,pxc-db,ps-operator,ps-operator-crds,ps-db,pg-operator,pg-operator-crds,pg-db
      SUPPORTED_JOBS: install
    steps:
      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0

      - name: Detect tests
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPPORTED_OPERATORS: ${{ matrix.product }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            .github/workflows/scripts/detect-comment
          else
            .github/workflows/scripts/detect-changes
          fi

      - name: Checkout PR merge
        if: >-
          !env.ACT &&
          github.event_name == 'issue_comment' &&
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        env:
          MERGE_SHA: ${{ steps.changes.outputs.merge-sha }}
        run: git checkout --detach "$MERGE_SHA"

      - uses: azure/setup-helm@v5.0.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          version: v3.21.0

      - name: Resolve latest Kind and Kubernetes versions
        id: kind
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        run: |
          release="$(
            curl --fail --silent --show-error --location --retry 3 \
              https://api.github.com/repos/kubernetes-sigs/kind/releases/latest
          )"
          kind_version="$(jq -er '.tag_name' <<< "$release")"
          node_image="$(
            jq -r '.body' <<< "$release" |
              grep -Eo 'kindest/node:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}' |
              head -1
          )"
          [[ "$kind_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ &&
              "$node_image" =~ ^kindest/node:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Could not resolve the latest stable Kind and Kubernetes versions"
            exit 1
          }
          kubernetes_version="${node_image#kindest/node:}"
          kubernetes_version="${kubernetes_version%@*}"
          echo "kind-version=$kind_version" >> "$GITHUB_OUTPUT"
          echo "node-image=$node_image" >> "$GITHUB_OUTPUT"
          echo "kubernetes-version=$kubernetes_version" >> "$GITHUB_OUTPUT"
          echo "Using Kind $kind_version with Kubernetes $kubernetes_version"

      - uses: helm/kind-action@v1.14.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          version: ${{ steps.kind.outputs.kind-version }}
          node_image: ${{ steps.kind.outputs.node-image }}
          kubectl_version: ${{ steps.kind.outputs.kubernetes-version }}
          cluster_name: kind-${{ matrix.product }}-install

      - name: Configure Kind node resources
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        run: >-
          docker update --cpus 4 --memory 12g --memory-swap 12g
          "kind-${{ matrix.product }}-install-control-plane"

      - name: Install operator and database
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        run: |
          version="$(
            awk '$1 == "appVersion:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }' "charts/${{ matrix.product }}-operator/Chart.yaml"
          )"

          .github/workflows/scripts/test-operator-deploy \
            install "${{ matrix.product }}" "--version=$version"

      - name: Collect cluster logs
        if: failure()
        env:
          KIND_CLUSTER_NAME: kind-${{ matrix.product }}-install
        run: bash .github/workflows/scripts/collect-cluster-logs

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-${{ matrix.product }}-install
          path: cluster-logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: kind delete cluster --name "kind-${{ matrix.product }}-install" || true

  upgrade-test:
    name: upgrade-${{ matrix.product }}
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER') &&
       startsWith(github.event.comment.body, '/run-test-upgrade'))
    # PSMDB 8 cannot start on Linux kernels 6.19 through 7.0.13.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        product: [psmdb]
    steps:
      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0

      - name: Detect tests
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPPORTED_OPERATORS: ${{ matrix.product }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            .github/workflows/scripts/detect-comment
          else
            .github/workflows/scripts/detect-changes
          fi

      - name: Checkout PR merge
        if: >-
          !env.ACT &&
          github.event_name == 'issue_comment' &&
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        env:
          MERGE_SHA: ${{ steps.changes.outputs.merge-sha }}
        run: git checkout --detach "$MERGE_SHA"

      - uses: azure/setup-helm@v5.0.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          version: v3.21.0

      - name: Resolve latest Kind and Kubernetes versions
        id: kind
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        run: |
          release="$(
            curl --fail --silent --show-error --location --retry 3 \
              https://api.github.com/repos/kubernetes-sigs/kind/releases/latest
          )"
          kind_version="$(jq -er '.tag_name' <<< "$release")"
          node_image="$(
            jq -r '.body' <<< "$release" |
              grep -Eo 'kindest/node:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}' |
              head -1
          )"
          [[ "$kind_version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ &&
              "$node_image" =~ ^kindest/node:v[0-9]+\.[0-9]+\.[0-9]+@sha256:[a-f0-9]{64}$ ]] || {
            echo "::error::Could not resolve the latest stable Kind and Kubernetes versions"
            exit 1
          }
          kubernetes_version="${node_image#kindest/node:}"
          kubernetes_version="${kubernetes_version%@*}"
          echo "kind-version=$kind_version" >> "$GITHUB_OUTPUT"
          echo "node-image=$node_image" >> "$GITHUB_OUTPUT"
          echo "kubernetes-version=$kubernetes_version" >> "$GITHUB_OUTPUT"
          echo "Using Kind $kind_version with Kubernetes $kubernetes_version"

      - uses: helm/kind-action@v1.14.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          version: ${{ steps.kind.outputs.kind-version }}
          node_image: ${{ steps.kind.outputs.node-image }}
          kubectl_version: ${{ steps.kind.outputs.kubernetes-version }}
          cluster_name: kind-${{ matrix.product }}-upgrade

      - name: Configure Kind node resources
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        run: >-
          docker update --cpus 4 --memory 12g --memory-swap 12g
          "kind-${{ matrix.product }}-upgrade-control-plane"

      - name: Install previous version and upgrade
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          steps.changes.outputs.base-sha != '' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        env:
          BASE_SHA: ${{ steps.changes.outputs.base-sha }}
        run: |
          version="$(
            awk '$1 == "appVersion:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }' "charts/${{ matrix.product }}-operator/Chart.yaml"
          )"

          .github/workflows/scripts/test-operator-deploy \
            upgrade "${{ matrix.product }}" "--version=$version"

      - name: Collect cluster logs
        if: failure()
        env:
          KIND_CLUSTER_NAME: kind-${{ matrix.product }}-upgrade
        run: bash .github/workflows/scripts/collect-cluster-logs

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-${{ matrix.product }}-upgrade
          path: cluster-logs/
          retention-days: 1
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: kind delete cluster --name "kind-${{ matrix.product }}-upgrade" || true
