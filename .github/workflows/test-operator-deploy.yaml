name: operator-test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/psmdb-operator/**'
      - '!charts/psmdb-operator/crds/**'
      - 'charts/psmdb-operator-crds/**'
      - 'charts/psmdb-db/**'
      - 'charts/pxc-operator/**'
      - 'charts/pxc-operator-crds/**'
      - 'charts/pxc-db/**'
      - 'charts/ps-operator/**'
      - 'charts/ps-operator-crds/**'
      - 'charts/ps-db/**'
      - 'charts/pg-operator/**'
      - 'charts/pg-operator-crds/**'
      - 'charts/pg-db/**'
      - '.github/workflows/test-operator-deploy.yaml'
      - '.github/workflows/scripts/collect-cluster-logs'
      - '.github/workflows/scripts/detect-changes'
      - '.github/workflows/scripts/detect-comment'
      - '.github/workflows/scripts/test-operator-deploy'
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  SUPPORTED_CHARTS: psmdb-operator,psmdb-operator-crds,psmdb-db
  SUPPORTED_JOBS: install,upgrade
  SELECT_ALL_ON_CHANGES: >-
    .github/workflows/test-operator-deploy.yaml,
    .github/workflows/scripts/collect-cluster-logs,
    .github/workflows/scripts/detect-changes,
    .github/workflows/scripts/detect-comment,
    .github/workflows/scripts/test-operator-deploy

jobs:
  install-test:
    name: install-${{ matrix.product }}
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER') &&
       startsWith(github.event.comment.body, '/run-test-upgrade'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        product: [psmdb, pxc, ps, pg]
    env:
      SUPPORTED_CHARTS: psmdb-operator,psmdb-operator-crds,psmdb-db,pxc-operator,pxc-operator-crds,pxc-db,ps-operator,ps-operator-crds,ps-db,pg-operator,pg-operator-crds,pg-db
      SUPPORTED_JOBS: install
    steps:
      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0

      - name: Detect tests
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPPORTED_OPERATORS: ${{ matrix.product }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            .github/workflows/scripts/detect-comment
          else
            .github/workflows/scripts/detect-changes
          fi

      - name: Checkout PR merge
        if: >-
          !env.ACT &&
          github.event_name == 'issue_comment' &&
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        env:
          MERGE_SHA: ${{ steps.changes.outputs.merge-sha }}
        run: git checkout --detach "$MERGE_SHA"

      - uses: azure/setup-helm@v5.0.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          version: v3.21.0

      - uses: manusa/actions-setup-minikube@v2.19.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          minikube version: v1.39.0
          kubernetes version: v1.34.0
          driver: docker
          start args: >-
            --cpus=4
            --memory=12gb
            --base-image=gcr.io/k8s-minikube/kicbase:v0.0.51
            --profile=minikube-${{ matrix.product }}-install
            --force
          github token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        if: >-
          matrix.product != 'psmdb' &&
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          python-version: '3.13'

      - uses: helm/chart-testing-action@v2.8.0
        if: >-
          matrix.product != 'psmdb' &&
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)

      - name: Install operator and database
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        run: |
          if [[ "${{ matrix.product }}" != psmdb ]]; then
            operator="${{ matrix.product }}-operator"
            crd="$operator-crds"
            crd_args=()
            if [[ -f "charts/$crd/Chart.yaml" ]]; then
              helm install "$crd" "charts/$crd" \
                --namespace default --wait --timeout 5m
              crd_args+=(--skip-crds)
            fi
            image_args=()
            if [[ "$GITHUB_BASE_REF" == release-* ]]; then
              repository="$(yq -r '.operatorImageRepository // ""' "charts/$operator/values.yaml")"
              if [[ -n "$repository" ]]; then
                image_args=(
                  --set "operatorImageRepository=perconalab/${repository##*/}"
                  --set "image=perconalab/${repository##*/}:main"
                )
              else
                repository="$(yq -r '.image.repository' "charts/$operator/values.yaml")"
                image_args=(
                  --set "image.repository=perconalab/${repository##*/}"
                  --set image.tag=main
                )
              fi
            fi
            helm install "$operator" "charts/$operator" \
              --namespace default --wait --timeout 10m \
              "${image_args[@]}" "${crd_args[@]}"
            ct install \
              --config .github/ct.yaml \
              --charts="charts/${{ matrix.product }}-db" \
              --target-branch "${GITHUB_BASE_REF:-main}"
            helm uninstall "$operator" --namespace default
            if [[ -f "charts/$crd/Chart.yaml" ]]; then
              helm uninstall "$crd" --namespace default
            fi
            exit 0
          fi

          version="$(
            awk '$1 == "appVersion:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }' "charts/${{ matrix.product }}-operator/Chart.yaml"
          )"

          .github/workflows/scripts/test-operator-deploy \
            install "${{ matrix.product }}" "--version=$version"

      - name: Collect cluster logs
        if: failure()
        env:
          MINIKUBE_PROFILE: minikube-${{ matrix.product }}-install
        run: bash .github/workflows/scripts/collect-cluster-logs

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-${{ matrix.product }}-install
          path: cluster-logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          minikube \
            --profile "minikube-${{ matrix.product }}-install" \
            delete || true
          docker volume rm \
            "minikube-${{ matrix.product }}-install" || true

  upgrade-test:
    name: upgrade-${{ matrix.product }}
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER') &&
       startsWith(github.event.comment.body, '/run-test-upgrade'))
    # PSMDB 8 cannot start on Linux kernels 6.19 through 7.0.13.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        product: [psmdb]
    steps:
      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0

      - name: Detect tests
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPPORTED_OPERATORS: ${{ matrix.product }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            .github/workflows/scripts/detect-comment
          else
            .github/workflows/scripts/detect-changes
          fi

      - name: Checkout PR merge
        if: >-
          !env.ACT &&
          github.event_name == 'issue_comment' &&
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        env:
          MERGE_SHA: ${{ steps.changes.outputs.merge-sha }}
        run: git checkout --detach "$MERGE_SHA"

      - uses: azure/setup-helm@v5.0.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          version: v3.21.0

      - uses: manusa/actions-setup-minikube@v2.19.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          minikube version: v1.39.0
          kubernetes version: v1.34.0
          driver: docker
          start args: >-
            --cpus=4
            --memory=12gb
            --base-image=gcr.io/k8s-minikube/kicbase:v0.0.51
            --profile=minikube-${{ matrix.product }}-upgrade
            --force
          github token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install previous version and upgrade
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          steps.changes.outputs.base-sha != '' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        env:
          BASE_SHA: ${{ steps.changes.outputs.base-sha }}
        run: |
          version="$(
            awk '$1 == "appVersion:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }' "charts/${{ matrix.product }}-operator/Chart.yaml"
          )"

          .github/workflows/scripts/test-operator-deploy \
            upgrade "${{ matrix.product }}" "--version=$version"

      - name: Collect cluster logs
        if: failure()
        env:
          MINIKUBE_PROFILE: minikube-${{ matrix.product }}-upgrade
        run: bash .github/workflows/scripts/collect-cluster-logs

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-${{ matrix.product }}-upgrade
          path: cluster-logs/
          retention-days: 1
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          minikube \
            --profile "minikube-${{ matrix.product }}-upgrade" \
            delete || true
          docker volume rm \
            "minikube-${{ matrix.product }}-upgrade" || true
