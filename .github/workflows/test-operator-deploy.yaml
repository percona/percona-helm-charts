name: operator-test

on:
  pull_request:
    branches:
      - main
    paths:
      - 'charts/psmdb-operator/**'
      - '!charts/psmdb-operator/crds/**'
      - 'charts/psmdb-operator-crds/**'
      - 'charts/psmdb-db/**'
      - 'charts/pxc-operator/**'
      - 'charts/pxc-operator-crds/**'
      - 'charts/pxc-db/**'
      - 'charts/ps-operator/**'
      - 'charts/ps-operator-crds/**'
      - 'charts/ps-db/**'
      - 'charts/pg-operator/**'
      - 'charts/pg-operator-crds/**'
      - 'charts/pg-db/**'
      - '.github/workflows/test-operator-deploy.yaml'
      - '.github/workflows/scripts/collect-cluster-logs'
      - '.github/workflows/scripts/detect-changes'
      - '.github/workflows/scripts/detect-comment'
      - '.github/workflows/scripts/test-operator-deploy'
      - '.github/workflows/files/minimal-*-values.yaml'
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  SUPPORTED_CHARTS: psmdb-operator,psmdb-operator-crds,psmdb-db
  SUPPORTED_JOBS: install,upgrade
  SELECT_ALL_ON_CHANGES: >-
    .github/workflows/test-operator-deploy.yaml,
    .github/workflows/scripts/collect-cluster-logs,
    .github/workflows/scripts/detect-changes,
    .github/workflows/scripts/detect-comment,
    .github/workflows/scripts/test-operator-deploy,
    .github/workflows/files/minimal-psmdb-values.yaml,
    .github/workflows/files/minimal-ps-values.yaml,
    .github/workflows/files/minimal-pxc-values.yaml,
    .github/workflows/files/minimal-pg-values.yaml

jobs:
  install-test:
    name: install-${{ matrix.product }}
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER') &&
       startsWith(github.event.comment.body, '/run-test-upgrade'))
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        product: [psmdb, pxc, ps, pg]
    env:
      SUPPORTED_CHARTS: psmdb-operator,psmdb-operator-crds,psmdb-db,pxc-operator,pxc-operator-crds,pxc-db,ps-operator,ps-operator-crds,ps-db,pg-operator,pg-operator-crds,pg-db
      SUPPORTED_JOBS: install
    steps:
      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0

      - name: Detect tests
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPPORTED_OPERATORS: ${{ matrix.product }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            .github/workflows/scripts/detect-comment
          else
            .github/workflows/scripts/detect-changes
          fi

      - name: Checkout PR merge
        if: >-
          !env.ACT &&
          github.event_name == 'issue_comment' &&
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        env:
          MERGE_SHA: ${{ steps.changes.outputs.merge-sha }}
        run: git checkout --detach "$MERGE_SHA"

      - uses: azure/setup-helm@v5.0.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          version: v3.21.0

      - name: Resolve latest stable Kubernetes version
        id: kubernetes
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        run: |
          version="$(curl --fail --silent --show-error --location --retry 3 https://dl.k8s.io/release/stable.txt)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid Kubernetes version: $version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Kubernetes $version"

      - uses: manusa/actions-setup-minikube@v2.19.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          minikube version: v1.39.0
          kubernetes version: ${{ steps.kubernetes.outputs.version }}
          driver: docker
          container runtime: containerd
          start args: >-
            --cpus=4
            --memory=12gb
            --base-image=gcr.io/k8s-minikube/kicbase:v0.0.51
            --profile=minikube-${{ matrix.product }}-install
            --force
          github token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install operator and database
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'install') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        run: |
          version="$(
            awk '$1 == "appVersion:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }' "charts/${{ matrix.product }}-operator/Chart.yaml"
          )"

          .github/workflows/scripts/test-operator-deploy \
            install "${{ matrix.product }}" "--version=$version"

      - name: Collect cluster logs
        if: failure()
        env:
          MINIKUBE_PROFILE: minikube-${{ matrix.product }}-install
        run: bash .github/workflows/scripts/collect-cluster-logs

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-${{ matrix.product }}-install
          path: cluster-logs/
          retention-days: 30
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          minikube \
            --profile "minikube-${{ matrix.product }}-install" \
            delete || true
          docker volume rm \
            "minikube-${{ matrix.product }}-install" || true

  upgrade-test:
    name: upgrade-${{ matrix.product }}
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       (github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER') &&
       startsWith(github.event.comment.body, '/run-test-upgrade'))
    # PSMDB 8 cannot start on Linux kernels 6.19 through 7.0.13.
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        product: [psmdb]
    steps:
      - uses: actions/checkout@v4
        if: ${{ !env.ACT }}
        with:
          fetch-depth: 0

      - name: Detect tests
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          SUPPORTED_OPERATORS: ${{ matrix.product }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == issue_comment ]]; then
            .github/workflows/scripts/detect-comment
          else
            .github/workflows/scripts/detect-changes
          fi

      - name: Checkout PR merge
        if: >-
          !env.ACT &&
          github.event_name == 'issue_comment' &&
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        env:
          MERGE_SHA: ${{ steps.changes.outputs.merge-sha }}
        run: git checkout --detach "$MERGE_SHA"

      - uses: azure/setup-helm@v5.0.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          version: v3.21.0

      - name: Resolve latest stable Kubernetes version
        id: kubernetes
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        run: |
          version="$(curl --fail --silent --show-error --location --retry 3 https://dl.k8s.io/release/stable.txt)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Invalid Kubernetes version: $version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using Kubernetes $version"

      - uses: manusa/actions-setup-minikube@v2.19.0
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        with:
          minikube version: v1.39.0
          kubernetes version: ${{ steps.kubernetes.outputs.version }}
          driver: docker
          container runtime: containerd
          start args: >-
            --cpus=4
            --memory=12gb
            --base-image=gcr.io/k8s-minikube/kicbase:v0.0.51
            --profile=minikube-${{ matrix.product }}-upgrade
            --force
          github token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install previous version and upgrade
        if: >-
          steps.changes.outputs.should-run == 'true' &&
          steps.changes.outputs.base-sha != '' &&
          contains(fromJSON(steps.changes.outputs.jobs), 'upgrade') &&
          contains(fromJSON(steps.changes.outputs.products), matrix.product)
        env:
          BASE_SHA: ${{ steps.changes.outputs.base-sha }}
        run: |
          version="$(
            awk '$1 == "appVersion:" {
              gsub(/"/, "", $2)
              print $2
              exit
            }' "charts/${{ matrix.product }}-operator/Chart.yaml"
          )"

          .github/workflows/scripts/test-operator-deploy \
            upgrade "${{ matrix.product }}" "--version=$version"

      - name: Collect cluster logs
        if: failure()
        env:
          MINIKUBE_PROFILE: minikube-${{ matrix.product }}-upgrade
        run: bash .github/workflows/scripts/collect-cluster-logs

      - name: Upload cluster logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs-${{ matrix.product }}-upgrade
          path: cluster-logs/
          retention-days: 1
          if-no-files-found: warn

      - name: Cleanup
        if: always()
        run: |
          minikube \
            --profile "minikube-${{ matrix.product }}-upgrade" \
            delete || true
